<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,0,2]},"psalm":{"title":"Psalm","lines":["[R2]: Take a deep breath, God;  calm down— don’t be so hasty with your punishing rod.","[R1]: Your sharp-pointed arrows of rebuke draw blood;  my backside stings from your discipline.","[R3]: I’ve lost twenty pounds in two months because of your accusation.  My bones are brittle as dry sticks because of my sin.","[R2]: I’m swamped by my bad behavior, collapsed under an avalanche of guilt.  The cuts in my flesh stink and grow maggots because I’ve lived so badly.","[R1]: And now I’m flat on my face feeling sorry for myself morning to night.  All my insides are on fire, my body is a wreck.","[R3]: I’m on my last legs;  I’ve had it— my life is a vomit of groans.  Lord, my longings are sitting in plain sight, my groans an old story to you.","[R2]: My heart’s about to break;  I’m a burned-out case.  Cataracts blind me to God and good;","[R1]: old friends avoid me like the plague.  My cousins never visit, my neighbors stab me in the back.","[R3]: My competitors blacken my name, devoutly they pray for my ruin.  But I’m deaf and mute to it all, ears shut, mouth shut.","[R2]: I don’t hear a word they say, don’t speak a word in response.  What I do, God, is wait for you, wait for my Lord, my God—you will answer!","[R1]: I wait and pray so they won’t laugh me off, won’t smugly strut off when I stumble.","[R3]: I’m on the edge of losing it— the pain in my gut keeps burning.  I’m ready to tell my story of failure, I’m no longer smug in my sin.","[R2]: My enemies are alive and in action, a lynch mob after my neck.  I give out good and get back evil from God-haters who can’t stand a God-lover.","[R1]: Don’t dump me, God;  my God, don’t stand me up.  Hurry and help me;  I want some wide-open space in my life! — PSA 38"]},"lesson3":{"title":"Gospel","lines":["[R2]: When the course of his priestly assignment was completed, he went back home.  It wasn’t long before his wife, Elizabeth, conceived.","[R1]: She went off by herself for five months, relishing her pregnancy.  “So, this is how God acts to remedy my unfortunate condition!”","[R3]: she said.  In the sixth month of Elizabeth’s pregnancy, God sent the angel Gabriel to the Galilean village of Nazareth to a virgin engaged to be married to a man descended from David.","[R2]: His name was Joseph, and the virgin’s name, Mary.  Upon entering, Gabriel greeted her: Good morning!","[R1]: You’re beautiful with God’s beauty, Beautiful inside and out!  God be with you.","[R3]: She was thoroughly shaken, wondering what was behind a greeting like that.  But the angel assured her, “Mary, you have nothing to fear.","[R2]: God has a surprise for you: You will become pregnant and give birth to a son and call his name Jesus.","[R1]: He will be great, be called ‘Son of the Highest.’  The Lord God will give him the throne of his father David;","[R3]: He will rule Jacob’s house forever— no end, ever, to his kingdom.”  Mary said to the angel, “But how?","[R2]: I’ve never slept with a man.”  The angel answered, The Holy Spirit will come upon you, the power of the Highest hover over you;","[R1]: Therefore, the child you bring to birth will be called Holy, Son of God.  “And did you know that your cousin Elizabeth conceived a son, old as she is?","[R3]: Everyone called her barren, and here she is six months pregnant!  Nothing, you see, is impossible with God.”","[R2]: And Mary said, Yes, I see it all now: I’m the Lord’s maid, ready to serve.  Let it be with me just as you say.","[R1]: Then the angel left her.  Mary didn’t waste a minute.  She got up and traveled to a town in Judah in the hill country, straight to Zachariah’s house, and greeted Elizabeth.","[R3]: When Elizabeth heard Mary’s greeting, the baby in her womb leaped.  She was filled with the Holy Spirit, and sang out exuberantly, You’re so blessed among women, and the babe in your womb, also blessed!","[R2]: And why am I so blessed that the mother of my Lord visits me?  The moment the sound of your greeting entered my ears, The babe in my womb skipped like a lamb for sheer joy.","[R1]: Blessed woman, who believed what God said, believed every word would come true!","[R3]: And Mary said, I’m bursting with God-news;  I’m dancing the song of my Savior God.","[R2]: God took one good look at me, and look what happened— I’m the most fortunate woman on earth!","[R1]: What God has done for me will never be forgotten, the God whose very name is holy, set apart from all others.","[R3]: His mercy flows in wave after wave on those who are in awe before him.  He bared his arm and showed his strength, scattered the bluffing braggarts.","[R2]: He knocked tyrants off their high horses, pulled victims out of the mud.  The starving poor sat down to a banquet;","[R1]: the callous rich were left out in the cold.  He embraced his chosen child, Israel;","[R3]: he remembered and piled on the mercies, piled them high.  It’s exactly what he promised, beginning with Abraham and right up to now.","[R2]: Mary stayed with Elizabeth for three months and then went back to her own home. — LUK 1"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you Father for your Holy Spirit, the Lord, the giver of life.","[S2]: Who proceeds from you and the Son, with you both is adored and glorified.","[S3]: Who spoke through the prophets, shaping our story and mission in Holy Scripture..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
