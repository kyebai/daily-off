<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,2,1]},"psalm":{"title":"Psalm","lines":["[R1]: I run to you, God;  I run for dear life.  Don’t let me down!  Take me seriously this time!","[R3]: Get down on my level and listen, and please—no procrastination!  Your granite cave a hiding place, your high cliff nest a place of safety.","[R2]: You’re my cave to hide in, my cliff to climb.  Be my safe leader, be my true mountain guide.","[R1]: Free me from hidden traps;  I want to hide in you.  I’ve put my life in your hands.","[R3]: You won’t drop me, you’ll never let me down.  I hate all this silly religion, but you, God, I trust.","[R2]: I’m leaping and singing in the circle of your love;  you saw my pain, you disarmed my tormentors, You didn’t leave me in their clutches but gave me room to breathe.","[R1]: Be kind to me, God— I’m in deep, deep trouble again.  I’ve cried my eyes out;  I feel hollow inside.","[R3]: My life leaks away, groan by groan;  my years fade out in sighs.  My troubles have worn me out, turned my bones to powder.","[R2]: To my enemies I’m a monster;  I’m ridiculed by the neighbors.  My friends are horrified;","[R1]: they cross the street to avoid me.  They want to blot me from memory, forget me like a corpse in a grave, discard me like a broken dish in the trash.","[R3]: The street-talk gossip has me “criminally insane”!  Behind locked doors they plot how to ruin me for good.","[R2]: Desperate, I throw myself on you: you are my God!  Hour by hour I place my days in your hand, safe from the hands out to get me.","[R1]: Warm me, your servant, with a smile;  save me because you love me.  Don’t embarrass me by not showing up;","[R3]: I’ve given you plenty of notice.  Embarrass the wicked, stand them up, leave them stupidly shaking their heads as they drift down to hell.","[R2]: Gag those loudmouthed liars who heckle me, your follower, with jeers and catcalls.","[R1]: What a stack of blessing you have piled up for those who worship you, Ready and waiting for all who run to you to escape an unkind world.","[R3]: You hide them safely away from the opposition.  As you slam the door on those oily, mocking faces, you silence the poisonous gossip.","[R2]: Blessed God!  His love is the wonder of the world.  Trapped by a siege, I panicked.","[R1]: “Out of sight, out of mind,” I said.  But you heard me say it, you heard and listened.","[R3]: Love God, all you saints;  God takes care of all who stay close to him, But he pays back in full those arrogant enough to go it alone.","[R2]: Be brave.  Be strong.  Don’t give up.  Expect God to get here soon. — PSA 31"]},"lesson3":{"title":"Gospel","lines":["[R1]: At dawn’s first light, the high priests, with the religious leaders and scholars, arranged a conference with the entire Jewish Council.","[R3]: After tying Jesus securely, they took him out and presented him to Pilate.  Pilate asked him, “Are you the ‘King of the Jews’?”","[R2]: He answered, “If you say so.”  The high priests let loose a barrage of accusations.","[R1]: Pilate asked again, “Aren’t you going to answer anything?  That’s quite a list of accusations.”","[R3]: Still, he said nothing.  Pilate was impressed, really impressed.  It was a custom at the Feast to release a prisoner, anyone the people asked for.","[R2]: There was one prisoner called Barabbas, locked up with the insurrectionists who had committed murder during the uprising against Rome.","[R1]: As the crowd came up and began to present its petition for him to release a prisoner, Pilate anticipated them: “Do you want me to release the King of the Jews to you?”","[R3]: Pilate knew by this time that it was through sheer spite that the high priests had turned Jesus over to him.","[R2]: But the high priests by then had worked up the crowd to ask for the release of Barabbas.","[R1]: Pilate came back, “So what do I do with this man you call King of the Jews?”  They yelled, “Nail him to a cross!”","[R3]: Pilate objected, “But for what crime?”  But they yelled all the louder, “Nail him to a cross!”","[R2]: Pilate gave the crowd what it wanted, set Barabbas free and turned Jesus over for whipping and crucifixion.","[R1]: The soldiers took Jesus into the palace (called Praetorium) and called together the entire brigade.","[R3]: They dressed him up in purple and put a crown plaited from a thornbush on his head.","[R2]: Then they began their mockery: “Bravo, King of the Jews!”  They banged on his head with a club, spit on him, and knelt down in mock worship.","[R1]: After they had had their fun, they took off the purple cape and put his own clothes back on him.","[R3]: Then they marched out to nail him to the cross.  There was a man walking by, coming from work, Simon from Cyrene, the father of Alexander and Rufus.","[R2]: They made him carry Jesus’ cross.  The soldiers brought Jesus to Golgotha, meaning “Skull Hill.”","[R1]: They offered him a mild painkiller (wine mixed with myrrh), but he wouldn’t take it.","[R3]: And they nailed him to the cross.  They divided up his clothes and threw dice to see who would get them.","[R2]: They nailed him up at nine o’clock in the morning.  The charge against him—the king of the jews—was scrawled across a sign.","[R1]: Along with him, they crucified two criminals, one to his right, the other to his left.","[R3]: People passing along the road jeered, shaking their heads in mock lament: “You bragged that you could tear down the Temple and then rebuild it in three days—so show us your stuff!","[R2]: Save yourself!  If you’re really God’s Son, come down from that cross!”  The high priests, along with the religion scholars, were right there mixing it up with the rest of them, having a great time poking fun at him: “He saved others—but he can’t save himself!","[R1]: Messiah, is he?  King of Israel?  Then let him climb down from that cross.  We’ll all become believers then!”","[R3]: Even the men crucified alongside him joined in the mockery.  At noon the sky became extremely dark.","[R2]: The darkness lasted three hours.  At three o’clock, Jesus groaned out of the depths, crying loudly, “Eloi, Eloi, lama sabachthani?”","[R1]: which means, “My God, my God, why have you abandoned me?”  Some of the bystanders who heard him said, “Listen, he’s calling for Elijah.”","[R3]: Someone ran off, soaked a sponge in sour wine, put it on a stick, and gave it to him to drink, saying, “Let’s see if Elijah comes to take him down.”","[R2]: But Jesus, with a loud cry, gave his last breath.  At that moment the Temple curtain ripped right down the middle.","[R1]: When the Roman captain standing guard in front of him saw that he had quit breathing, he said, “This has to be the Son of God!”","[R3]: There were women watching from a distance, among them Mary Magdalene, Mary the mother of the younger James and Joses, and Salome.","[R2]: When Jesus was in Galilee, these women followed and served him, and had come up with him to Jerusalem.","[R1]: Late in the afternoon, since it was the Day of Preparation (that is, Sabbath eve), Joseph of Arimathea, a highly respected member of the Jewish Council, came.","[R3]: He was one who lived expectantly, on the lookout for the kingdom of God.  Working up his courage, he went to Pilate and asked for Jesus’ body.","[R2]: Pilate questioned whether he could be dead that soon and called for the captain to verify that he was really dead.","[R1]: Assured by the captain, he gave Joseph the corpse.  Having already purchased a linen shroud, Joseph took him down, wrapped him in the shroud, placed him in a tomb that had been cut into the rock, and rolled a large stone across the opening.","[R3]: Mary Magdalene and Mary, mother of Joses, watched the burial. — MRK 15"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for King Jesus, who was born of the Father before all ages.","[S2]: He is God from God, Light from Light, true God from true God. Begotten, not made.","[S3]: He is consubstantial with the Father; through him all things were made..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
