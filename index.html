<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,0,1]},"psalm":{"title":"Psalm","lines":["[R3]: Hallelujah!  Sing to God a brand-new song, praise him in the company of all who love him.","[R1]: Let all Israel celebrate their Sovereign Creator, Zion’s children exult in their King.","[R2]: Let them praise his name in dance;  strike up the band and make great music!  And why?","[R3]: Because God delights in his people, adorns plain folk with salvation garlands!","[R1]: Let true lovers break out in praise, sing out from wherever they’re sitting, Shout the high praises of God, brandish their swords in the wild sword-dance— A portent of vengeance on the God-defying nations, a signal that punishment’s coming, Their kings chained and hauled off to jail, their leaders behind bars for good, The judgment on them carried out to the letter —and all who love God in the seat of honor!","[R2]: Hallelujah!  Hallelujah!  Praise God in his holy house of worship, praise him under the open skies;","[R3]: Praise him for his acts of power, praise him for his magnificent greatness;  Praise with a blast on the trumpet, praise by strumming soft strings;","[R1]: Praise him with castanets and dance, praise him with banjo and flute;  Praise him with cymbals and a big bass drum, praise him with fiddles and mandolin.","[R2]: Let every living, breathing creature praise God!  Hallelujah! — PSA 149"]},"lesson3":{"title":"Gospel","lines":["[R3]: From there he went to the area of Judea across the Jordan.  A crowd of people, as was so often the case, went along, and he, as he so often did, taught them.","[R1]: Pharisees came up, intending to give him a hard time.  They asked, “Is it legal for a man to divorce his wife?”","[R2]: Jesus said, “What did Moses command?”  They answered, “Moses gave permission to fill out a certificate of dismissal and divorce her.”","[R3]: Jesus said, “Moses wrote this command only as a concession to your hardhearted ways.","[R1]: In the original creation, God made male and female to be together.  Because of this, a man leaves father and mother, and in marriage he becomes one flesh with a woman—no longer two individuals, but forming a new unity.","[R2]: Because God created this organic union of the two sexes, no one should desecrate his art by cutting them apart.”","[R3]: When they were back home, the disciples brought it up again.  Jesus gave it to them straight: “A man who divorces his wife so he can marry someone else commits adultery against her.","[R1]: And a woman who divorces her husband so she can marry someone else commits adultery.”","[R2]: * * * The people brought children to Jesus, hoping he might touch them.  The disciples shooed them off.","[R3]: But Jesus was irate and let them know it: “Don’t push these children away.  Don’t ever get between them and me.","[R1]: These children are at the very center of life in the kingdom.  Mark this: Unless you accept God’s kingdom in the simplicity of a child, you’ll never get in.”","[R2]: Then, gathering the children up in his arms, he laid his hands of blessing on them.","[R3]: As he went out into the street, a man came running up, greeted him with great reverence, and asked, “Good Teacher, what must I do to get eternal life?”","[R1]: Jesus said, “Why are you calling me good?  No one is good, only God.  You know the commandments: Don’t murder, don’t commit adultery, don’t steal, don’t lie, don’t cheat, honor your father and mother.”","[R2]: He said, “Teacher, I have—from my youth—kept them all!”  Jesus looked him hard in the eye—and loved him!","[R3]: He said, “There’s one thing left: Go sell whatever you own and give it to the poor.","[R1]: All your wealth will then be heavenly wealth.  And come follow me.”  The man’s face clouded over.","[R2]: This was the last thing he expected to hear, and he walked off with a heavy heart.","[R3]: He was holding on tight to a lot of things, and not about to let go.  Looking at his disciples, Jesus said, “Do you have any idea how difficult it is for people who ‘have it all’ to enter God’s kingdom?”","[R1]: The disciples couldn’t believe what they were hearing, but Jesus kept on: “You can’t imagine how difficult.","[R2]: I’d say it’s easier for a camel to go through a needle’s eye than for the rich to get into God’s kingdom.”","[R3]: That got their attention.  “Then who has any chance at all?”  they asked.  Jesus was blunt: “No chance at all if you think you can pull it off by yourself.","[R1]: Every chance in the world if you let God do it.”  Peter tried another angle: “We left everything and followed you.”","[R2]: Jesus said, “Mark my words, no one who sacrifices house, brothers, sisters, mother, father, children, land—whatever—because of me and the Message will lose out.","[R3]: They’ll get it all back, but multiplied many times in homes, brothers, sisters, mothers, children, and land—but also in troubles.","[R1]: And then the bonus of eternal life!  This is once again the Great Reversal: Many who are first will end up last, and the last first.” — MRK 10"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you Father for your Holy Spirit, the Lord, the giver of life.","[S2]: Who proceeds from you and the Son, with you both is adored and glorified.","[S3]: Who spoke through the prophets, shaping our story and mission in Holy Scripture..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
