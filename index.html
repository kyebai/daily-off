<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: God answer you on the day you crash, The name God-of-Jacob put you out of harm’s reach, Send reinforcements from Holy Hill, Dispatch from Zion fresh supplies, Exclaim over your offerings, Celebrate your sacrifices, Give you what your heart desires, Accomplish your plans.","[R2]: When you win, we plan to raise the roof and lead the parade with our banners.  May all your wishes come true!","[R3]: That clinches it—help’s coming, an answer’s on the way, everything’s going to work out.","[R1]: See those people polishing their chariots, and those others grooming their horses?","[R2]: But we’re making garlands for God our God.  The chariots will rust, those horses pull up lame— and we’ll be on our feet, standing tall.","[R3]: Make the king a winner, God;  the day we call, give us your answer.  Your strength, God, is the king’s strength.","[R1]: Helped, he’s hollering Hosannas.  You gave him exactly what he wanted;  you didn’t hold back.","[R2]: You filled his arms with gifts;  you gave him a right royal welcome.  He wanted a good life;","[R3]: you gave it to him, and then made it a long life as a bonus.  You lifted him high and bright as a cumulus cloud, then dressed him in rainbow colors.","[R1]: You pile blessings on him;  you make him glad when you smile.  Is it any wonder the king loves God?","[R2]: that he’s sticking with the Best?  With a fistful of enemies in one hand and a fistful of haters in the other, You radiate with such brilliance that they cringe as before a furnace.","[R3]: Now the furnace swallows them whole, the fire eats them alive!  You purge the earth of their progeny, you wipe the slate clean.","[R1]: All their evil schemes, the plots they cook up, have fizzled—every one.  You sent them packing;","[R2]: they couldn’t face you.  Show your strength, God, so no one can miss it.  We are out singing the good news! — PSA 20"]},"lesson3":{"title":"Gospel","lines":["[R1]: In only two days the eight-day Festival of Passover and the Feast of Unleavened Bread would begin.","[R2]: The high priests and religion scholars were looking for a way they could seize Jesus by stealth and kill him.","[R3]: They agreed that it should not be done during Passover Week.  “We don’t want the crowds up in arms,” they said.","[R1]: Jesus was at Bethany, a guest of Simon the Leper.  While he was eating dinner, a woman came up carrying a bottle of very expensive perfume.","[R2]: Opening the bottle, she poured it on his head.  Some of the guests became furious among themselves.","[R3]: “That’s criminal!  A sheer waste!  This perfume could have been sold for well over a year’s wages and handed out to the poor.”","[R1]: They swelled up in anger, nearly bursting with indignation over her.  But Jesus said, “Let her alone.","[R2]: Why are you giving her a hard time?  She has just done something wonderfully significant for me.","[R3]: You will have the poor with you every day for the rest of your lives.  Whenever you feel like it, you can do something for them.","[R1]: Not so with me.  She did what she could when she could—she pre-anointed my body for burial.","[R2]: And you can be sure that wherever in the whole world the Message is preached, what she just did is going to be talked about admiringly.”","[R3]: Judas Iscariot, one of the Twelve, went to the cabal of high priests, determined to betray him.","[R1]: They couldn’t believe their ears, and promised to pay him well.  He started looking for just the right moment to hand him over.","[R2]: On the first of the Days of Unleavened Bread, the day they prepare the Passover sacrifice, his disciples asked him, “Where do you want us to go and make preparations so you can eat the Passover meal?”","[R3]: He directed two of his disciples, “Go into the city.  A man carrying a water jug will meet you.","[R1]: Follow him.  Ask the owner of whichever house he enters, ‘The Teacher wants to know, Where is my guest room where I can eat the Passover meal with my disciples?’","[R2]: He will show you a spacious second-story room, swept and ready.  Prepare for us there.”","[R3]: The disciples left, came to the city, found everything just as he had told them, and prepared the Passover meal.","[R1]: After sunset he came with the Twelve.  As they were at the supper table eating, Jesus said, “I have something hard but important to say to you: One of you is going to hand me over to the conspirators, one who at this moment is eating with me.”","[R2]: Stunned, they started asking, one after another, “It isn’t me, is it?”  He said, “It’s one of the Twelve, one who eats with me out of the same bowl.","[R3]: In one sense, it turns out that the Son of Man is entering into a way of treachery well-marked by the Scriptures—no surprises here.","[R1]: In another sense, the man who turns him in, turns traitor to the Son of Man—better never to have been born than do this!”","[R2]: In the course of their meal, having taken and blessed the bread, he broke it and gave it to them.","[R3]: Then he said, Take, this is my body.  Taking the chalice, he gave it to them, thanking God, and they all drank from it.","[R1]: He said, This is my blood, God’s new covenant, Poured out for many people.  “I’ll not be drinking wine again until the new day when I drink it in the kingdom of God.” — MRK 14"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for your one, holy, catholic and apostolic Church.","[S2]: Where we confess one Baptism for the forgiveness of sins,","[S3]: And look forward to the resurrection of the dead and the life of the age to come."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
