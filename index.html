<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: They cast in metal a bull calf at Horeb and worshiped the statue they’d made.  They traded the Glory for a cheap piece of sculpture—a grass-chewing bull!","[R2]: They forgot God, their very own Savior, who turned things around in Egypt, Who created a world of wonders in the Land of Ham, who gave that stunning performance at the Red Sea.","[R3]: Fed up, God decided to get rid of them— and except for Moses, his chosen, he would have.","[R1]: But Moses stood in the gap and deflected God’s anger, prevented it from destroying them utterly.","[R2]: They went on to reject the Blessed Land, didn’t believe a word of what God promised.","[R3]: They found fault with the life they had and turned a deaf ear to God’s voice.  Exasperated, God swore that he’d lay them low in the desert, Scattering their children here and there, strewing them all over the earth.","[R1]: Then they linked up with Baal Peor, attending funeral banquets and eating idol food.","[R2]: That made God so angry that a plague spread through their ranks;  Phinehas stood up and pled their case and the plague was stopped.","[R3]: This was counted to his credit;  his descendants will never forget it.  They angered God again at Meribah Springs;","[R1]: this time Moses got mixed up in their evil;  Because they defied God yet again, Moses exploded and lost his temper.","[R2]: They didn’t wipe out those godless cultures as ordered by God;  Instead they intermarried with the heathen, and in time became just like them.","[R3]: They worshiped their idols, were caught in the trap of idols.  They sacrificed their sons and daughters at the altars of demon gods.","[R1]: They slit the throats of their babies, murdered their infant girls and boys.  They offered their babies to Canaan’s gods;","[R2]: the blood of their babies stained the land.  Their way of life reeked;  they lived like prostitutes.","[R3]: And God was furious—a wildfire anger;  he couldn’t stand even to look at his people.","[R1]: He turned them over to the heathen so that the people who hated them ruled them.","[R2]: Their enemies made life hard for them;  they were tyrannized under that rule.  Over and over God rescued them, but they never learned— until finally their sins destroyed them.","[R3]: Still, when God saw the trouble they were in and heard their cries for help, He remembered his Covenant with them, and, immense with love, took them by the hand.","[R1]: He poured out his mercy on them while their captors looked on, amazed. — PSA 106"]},"lesson3":{"title":"Gospel","lines":["[R1]: The soldiers assigned to the governor took Jesus into the governor’s palace and got the entire brigade together for some fun.","[R2]: They stripped him and dressed him in a red robe.  They plaited a crown from branches of a thornbush and set it on his head.","[R3]: They put a stick in his right hand for a scepter.  Then they knelt before him in mocking reverence: “Bravo, King of the Jews!”","[R1]: they said.  “Bravo!”  Then they spit on him and hit him on the head with the stick.","[R2]: When they had had their fun, they took off the robe and put his own clothes back on him.","[R3]: Then they proceeded out to the crucifixion.  Along the way they came on a man from Cyrene named Simon and made him carry Jesus’ cross.","[R1]: Arriving at Golgotha, the place they call “Skull Hill,” they offered him a mild painkiller (a mixture of wine and myrrh), but when he tasted it he wouldn’t drink it.","[R2]: After they had finished nailing him to the cross and were waiting for him to die, they killed time by throwing dice for his clothes.","[R3]: Above his head they had posted the criminal charge against him: this is jesus, the king of the jews.","[R1]: Along with him, they also crucified two criminals, one to his right, the other to his left.","[R2]: People passing along the road jeered, shaking their heads in mock lament: “You bragged that you could tear down the Temple and then rebuild it in three days—so show us your stuff!","[R3]: Save yourself!  If you’re really God’s Son, come down from that cross!”  The high priests, along with the religion scholars and leaders, were right there mixing it up with the rest of them, having a great time poking fun at him: “He saved others—he can’t save himself!","[R1]: King of Israel, is he?  Then let him get down from that cross.  We’ll all become believers then!","[R2]: He was so sure of God—well, let him rescue his ‘Son’ now—if he wants him!  He did claim to be God’s Son, didn’t he?”","[R3]: Even the two criminals crucified next to him joined in the mockery.  From noon to three, the whole earth was dark.","[R1]: Around mid-afternoon Jesus groaned out of the depths, crying loudly, “Eli, Eli, lama sabachthani?”","[R2]: which means, “My God, my God, why have you abandoned me?”  Some bystanders who heard him said, “He’s calling for Elijah.”","[R3]: One of them ran and got a sponge soaked in sour wine and lifted it on a stick so he could drink.","[R1]: The others joked, “Don’t be in such a hurry.  Let’s see if Elijah comes and saves him.”","[R2]: But Jesus, again crying out loudly, breathed his last.  At that moment, the Temple curtain was ripped in two, top to bottom.","[R3]: There was an earthquake, and rocks were split in pieces.  What’s more, tombs were opened up, and many bodies of believers asleep in their graves were raised.","[R1]: (After Jesus’ resurrection, they left the tombs, entered the holy city, and appeared to many.)","[R2]: The captain of the guard and those with him, when they saw the earthquake and everything else that was happening, were scared to death.","[R3]: They said, “This has to be the Son of God!”  There were also quite a few women watching from a distance, women who had followed Jesus from Galilee in order to serve him.","[R1]: Among them were Mary Magdalene, Mary the mother of James and Joseph, and the mother of the Zebedee brothers. — MAT 27"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for disclosing yourself as the one God.","[S2]: You are Father almighty, maker of heaven and earth, of all things visible and invisible,","[S3]: You begot one Lord, Jesus Christ, your only Son..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
