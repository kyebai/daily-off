<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,0,2]},"psalm":{"title":"Psalm","lines":["[R2]: God rules: there’s something to shout over!  On the double, mainlands and islands—celebrate!","[R1]: Bright clouds and storm clouds circle ’round him;  Right and justice anchor his rule.","[R3]: Fire blazes out before him, Flaming high up the craggy mountains.  His lightnings light up the world;","[R2]: Earth, wide-eyed, trembles in fear.  The mountains take one look at God And melt, melt like wax before earth’s Lord.","[R1]: The heavens announce that he’ll set everything right, And everyone will see it happen—glorious!","[R3]: All who serve handcrafted gods will be sorry— And they were so proud of their ragamuffin gods!","[R2]: On your knees, all you gods—worship him!  And Zion, you listen and take heart!","[R1]: Daughters of Zion, sing your hearts out: God has done it all, has set everything right.","[R3]: You, God, are High God of the cosmos, Far, far higher than any of the gods.  God loves all who hate evil, And those who love him he keeps safe, Snatches them from the grip of the wicked.","[R2]: Light-seeds are planted in the souls of God’s people, Joy-seeds are planted in good heart-soil.","[R1]: So, God’s people, shout praise to God, Give thanks to our Holy God!  Sing to God a brand-new song.","[R3]: He’s made a world of wonders!  He rolled up his sleeves, He set things right.  God made history with salvation, He showed the world what he could do.","[R2]: He remembered to love us, a bonus To his dear family, Israel—indefatigable love.","[R1]: The whole earth comes to attention.  Look—God’s work of salvation!  Shout your praises to God, everybody!","[R3]: Let loose and sing!  Strike up the band!  Round up an orchestra to play for God, Add on a hundred-voice choir.","[R2]: Feature trumpets and big trombones, Fill the air with praises to King God.  Let the sea and its fish give a round of applause, With everything living on earth joining in.","[R1]: Let ocean breakers call out, “Encore!”  And mountains harmonize the finale— A tribute to God when he comes, When he comes to set the earth right.","[R3]: He’ll straighten out the whole world, He’ll put the world right, and everyone in it. — PSA 97"]},"lesson3":{"title":"Gospel","lines":["[R2]: When Jesus finished saying these things, he told his disciples, “You know that Passover comes in two days.","[R1]: That’s when the Son of Man will be betrayed and handed over for crucifixion.”  At that very moment, the party of high priests and religious leaders was meeting in the chambers of the Chief Priest named Caiaphas, conspiring to seize Jesus by stealth and kill him.","[R3]: They agreed that it should not be done during Passover Week.  “We don’t want a riot on our hands,” they said.","[R2]: When Jesus was at Bethany, a guest of Simon the Leper, a woman came up to him as he was eating dinner and anointed him with a bottle of very expensive perfume.","[R1]: When the disciples saw what was happening, they were furious.  “That’s criminal!","[R3]: This could have been sold for a lot and the money handed out to the poor.”  When Jesus realized what was going on, he intervened.","[R2]: “Why are you giving this woman a hard time?  She has just done something wonderfully significant for me.","[R1]: You will have the poor with you every day for the rest of your lives, but not me.","[R3]: When she poured this perfume on my body, what she really did was anoint me for burial.","[R2]: You can be sure that wherever in the whole world the Message is preached, what she has just done is going to be remembered and admired.”","[R1]: That is when one of the Twelve, the one named Judas Iscariot, went to the cabal of high priests and said, “What will you give me if I hand him over to you?”","[R3]: They settled on thirty silver pieces.  He began looking for just the right moment to hand him over.","[R2]: On the first of the Days of Unleavened Bread, the disciples came to Jesus and said, “Where do you want us to prepare your Passover meal?”","[R1]: He said, “Enter the city.  Go up to a certain man and say, ‘The Teacher says, My time is near.","[R3]: I and my disciples plan to celebrate the Passover meal at your house.’”  The disciples followed Jesus’ instructions to the letter, and prepared the Passover meal.","[R2]: After sunset, he and the Twelve were sitting around the table.  During the meal, he said, “I have something hard but important to say to you: One of you is going to hand me over to the conspirators.”","[R1]: They were stunned, and then began to ask, one after another, “It isn’t me, is it, Master?”","[R3]: Jesus answered, “The one who hands me over is someone I eat with daily, one who passes me food at the table.","[R2]: In one sense the Son of Man is entering into a way of treachery well-marked by the Scriptures—no surprises here.","[R1]: In another sense that man who turns him in, turns traitor to the Son of Man—better never to have been born than do this!”","[R3]: Then Judas, already turned traitor, said, “It isn’t me, is it, Rabbi?”  Jesus said, “Don’t play games with me, Judas.”","[R2]: During the meal, Jesus took and blessed the bread, broke it, and gave it to his disciples: Take, eat.","[R1]: This is my body.  Taking the cup and thanking God, he gave it to them: Drink this, all of you.","[R3]: This is my blood, God’s new covenant poured out for many people for the forgiveness of sins.","[R2]: “I’ll not be drinking wine from this cup again until that new day when I’ll drink with you in the kingdom of my Father.”","[R1]: They sang a hymn and went directly to Mount Olives. — MAT 26"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you King Jesus for breaking the power of death, rising again on the third day in accordance with the Scriptures.","[S2]: Then you ascended into heaven, where you still sit at the right hand of the Father.","[S3]: But you will come again in glory to judge the living and the dead. Your kingdom will have no end..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
