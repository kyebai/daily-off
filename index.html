<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,0,1]},"psalm":{"title":"Psalm","lines":["[R3]: Blessed be the Lord— day after day he carries us along.  He’s our Savior, our God, oh yes!","[R1]: He’s God-for-us, he’s God-who-saves-us.  Lord God knows all death’s ins and outs.","[R2]: What’s more, he made heads roll, split the skulls of the enemy As he marched out of heaven, saying, “I tied up the Dragon in knots, put a muzzle on the Deep Blue Sea.”","[R3]: You can wade through your enemies’ blood, and your dogs taste of your enemies from your boots.","[R1]: See God on parade to the sanctuary, my God, my King on the march!  Singers out front, the band behind, maidens in the middle with castanets.","[R2]: The whole choir blesses God.  Like a fountain of praise, Israel blesses God.  Look—little Benjamin’s out front and leading Princes of Judah in their royal robes, princes of Zebulun, princes of Naphtali.","[R3]: Parade your power, O God, the power, O God, that made us what we are.  Your temple, High God, is Jerusalem;","[R1]: kings bring gifts to you.  Rebuke that old crocodile, Egypt, with her herd of wild bulls and calves, Rapacious in her lust for silver, crushing peoples, spoiling for a fight.","[R2]: Let Egyptian traders bring blue cloth and Cush come running to God, her hands outstretched.","[R3]: Sing, O kings of the earth!  Sing praises to the Lord!  There he is: Sky-Rider, striding the ancient skies.","[R1]: Listen—he’s calling in thunder, rumbling, rolling thunder.  Call out “Bravo!”  to God, the High God of Israel.","[R2]: His splendor and strength rise huge as thunderheads.  A terrible beauty, O God, streams from your sanctuary.","[R3]: It’s Israel’s strong God!  He gives power and might to his people!  O you, his people—bless God! — PSA 68"]},"lesson3":{"title":"Gospel","lines":["[R3]: Coming down off the mountain with them, he stood on a plain surrounded by disciples, and was soon joined by a huge congregation from all over Judea and Jerusalem, even from the seaside towns of Tyre and Sidon.","[R1]: They had come both to hear him and to be cured of their diseases.  Those disturbed by evil spirits were healed.","[R2]: Everyone was trying to touch him—so much energy surging from him, so many people healed!","[R3]: Then he spoke: You’re blessed when you’ve lost it all.  God’s kingdom is there for the finding.","[R1]: You’re blessed when you’re ravenously hungry.  Then you’re ready for the Messianic meal.","[R2]: You’re blessed when the tears flow freely.  Joy comes with the morning.  “Count yourself blessed every time someone cuts you down or throws you out, every time someone smears or blackens your name to discredit me.","[R3]: What it means is that the truth is too close for comfort and that that person is uncomfortable.","[R1]: You can be glad when that happens—skip like a lamb, if you like! —for even though they don’t like it, I do .","[R2]: .  .  and all heaven applauds.  And know that you are in good company;  my preachers and witnesses have always been treated like this.","[R3]: But it’s trouble ahead if you think you have it made.  What you have is all you’ll ever get.","[R1]: And it’s trouble ahead if you’re satisfied with yourself.  Your self will not satisfy you for long.","[R2]: And it’s trouble ahead if you think life’s all fun and games.  There’s suffering to be met, and you’re going to meet it.","[R3]: “There’s trouble ahead when you live only for the approval of others, saying what flatters them, doing what indulges them.","[R1]: Popularity contests are not truth contests—look how many scoundrel preachers were approved by your ancestors!","[R2]: Your task is to be true, not popular.  “To you who are ready for the truth, I say this: Love your enemies.","[R3]: Let them bring out the best in you, not the worst.  When someone gives you a hard time, respond with the supple moves of prayer for that person.","[R1]: If someone slaps you in the face, stand there and take it.  If someone grabs your shirt, giftwrap your best coat and make a present of it.","[R2]: If someone takes unfair advantage of you, use the occasion to practice the servant life.","[R3]: No more payback.  Live generously.  “Here is a simple rule of thumb for behavior: Ask yourself what you want people to do for you;","[R1]: then grab the initiative and do it for them!  If you only love the lovable, do you expect a pat on the back?","[R2]: Run-of-the-mill sinners do that.  If you only help those who help you, do you expect a medal?","[R3]: Garden-variety sinners do that.  If you only give for what you hope to get out of it, do you think that’s charity?","[R1]: The stingiest of pawnbrokers does that.  “I tell you, love your enemies.  Help and give without expecting a return.","[R2]: You’ll never—I promise—regret it.  Live out this God-created identity the way our Father lives toward us, generously and graciously, even when we’re at our worst.","[R3]: Our Father is kind;  you be kind.  “Don’t pick on people, jump on their failures, criticize their faults—unless, of course, you want the same treatment.","[R1]: Don’t condemn those who are down;  that hardness can boomerang.  Be easy on people;","[R2]: you’ll find life a lot easier.  Give away your life;  you’ll find life given back, but not merely given back—given back with bonus and blessing.","[R3]: Giving, not getting, is the way.  Generosity begets generosity.” — LUK 6"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for King Jesus, who was born of the Father before all ages.","[S2]: He is God from God, Light from Light, true God from true God. Begotten, not made.","[S3]: He is consubstantial with the Father; through him all things were made..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
