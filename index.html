<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,0,2]},"psalm":{"title":"Psalm","lines":["[R2]: Take a good look at my trouble, and help me— I haven’t forgotten your revelation.","[R1]: Take my side and get me out of this;  give me back my life, just as you promised.","[R3]: “Salvation” is only gibberish to the wicked because they’ve never looked it up in your dictionary.","[R2]: Your mercies, God, run into the billions;  following your guidelines, revive me.","[R1]: My antagonists are too many to count, but I don’t swerve from the directions you gave.","[R3]: I took one look at the quitters and was filled with loathing;  they walked away from your promises so casually!","[R2]: Take note of how I love what you tell me;  out of your life of love, prolong my life.","[R1]: Your words all add up to the sum total: Truth.  Your righteous decisions are eternal.","[R3]: * * * I’ve been slandered unmercifully by the politicians, but my awe at your words keeps me stable.","[R2]: I’m ecstatic over what you say, like one who strikes it rich.  I hate lies—can’t stand them!","[R1]: — but I love what you have revealed.  Seven times each day I stop and shout praises for the way you keep everything running right.","[R3]: For those who love what you reveal, everything fits— no stumbling around in the dark for them.","[R2]: I wait expectantly for your salvation;  God, I do what you tell me.  My soul guards and keeps all your instructions— oh, how much I love them!","[R1]: I follow your directions, abide by your counsel;  my life’s an open book before you.","[R3]: * * * Let my cry come right into your presence, God;  provide me with the insight that comes only from your Word.","[R2]: Give my request your personal attention, rescue me on the terms of your promise.","[R1]: Let praise cascade off my lips;  after all, you’ve taught me the truth about life!","[R3]: And let your promises ring from my tongue;  every order you’ve given is right.","[R2]: Put your hand out and steady me since I’ve chosen to live by your counsel.  I’m homesick, God, for your salvation;","[R1]: I love it when you show yourself!  Invigorate my soul so I can praise you well, use your decrees to put iron in my soul.","[R3]: And should I wander off like a lost sheep—seek me!  I’ll recognize the sound of your voice. — PSA 119"]},"lesson3":{"title":"Gospel","lines":["[R2]: He went back to teaching by the sea.  A crowd built up to such a great size that he had to get into an offshore boat, using the boat as a pulpit as the people pushed to the water’s edge.","[R1]: He taught by using stories, many stories.  “Listen.  What do you make of this?","[R3]: A farmer planted seed.  As he scattered the seed, some of it fell on the road and birds ate it.","[R2]: Some fell in the gravel;  it sprouted quickly but didn’t put down roots, so when the sun came up it withered just as quickly.","[R1]: Some fell in the weeds;  as it came up, it was strangled among the weeds and nothing came of it.","[R3]: Some fell on good earth and came up with a flourish, producing a harvest exceeding his wildest dreams.","[R2]: “Are you listening to this?  Really listening?”  When they were off by themselves, those who were close to him, along with the Twelve, asked about the stories.","[R1]: He told them, “You’ve been given insight into God’s kingdom—you know how it works.","[R3]: But to those who can’t see it yet, everything comes in stories, creating readiness, nudging them toward a welcome awakening.","[R2]: These are people— Whose eyes are open but don’t see a thing, Whose ears are open but don’t understand a word, Who avoid making an about-face and getting forgiven.”","[R1]: He continued, “Do you see how this story works?  All my stories work this way.","[R3]: “The farmer plants the Word.  Some people are like the seed that falls on the hardened soil of the road.","[R2]: No sooner do they hear the Word than Satan snatches away what has been planted in them.","[R1]: “And some are like the seed that lands in the gravel.  When they first hear the Word, they respond with great enthusiasm.","[R3]: But there is such shallow soil of character that when the emotions wear off and some difficulty arrives, there is nothing to show for it.","[R2]: “The seed cast in the weeds represents the ones who hear the kingdom news but are overwhelmed with worries about all the things they have to do and all the things they want to get.","[R1]: The stress strangles what they heard, and nothing comes of it.  “But the seed planted in the good earth represents those who hear the Word, embrace it, and produce a harvest beyond their wildest dreams.”","[R3]: Jesus went on: “Does anyone bring a lamp home and put it under a bucket or beneath the bed?","[R2]: Don’t you put it up on a table or on the mantel?  We’re not keeping secrets, we’re telling them;","[R1]: we’re not hiding things, we’re bringing them out into the open.  “Are you listening to this?","[R3]: Really listening?  “Listen carefully to what I am saying—and be wary of the shrewd advice that tells you how to get ahead in the world on your own.","[R2]: Giving, not getting, is the way.  Generosity begets generosity.  Stinginess impoverishes.”","[R1]: Then Jesus said, “God’s kingdom is like seed thrown on a field by a man who then goes to bed and forgets about it.","[R3]: The seed sprouts and grows—he has no idea how it happens.  The earth does it all without his help: first a green stem of grass, then a bud, then the ripened grain.","[R2]: When the grain is fully formed, he reaps—harvest time!  “How can we picture God’s kingdom?","[R1]: What kind of story can we use?  It’s like an acorn.  When it lands on the ground it is quite small as seeds go, yet once it is planted it grows into a huge oak tree with thick branches.","[R3]: Eagles nest in it.”  With many stories like these, he presented his message to them, fitting the stories to their experience and maturity.","[R2]: He was never without a story when he spoke.  When he was alone with his disciples, he went over everything, sorting out the tangles, untying the knots. — MRK 4"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for King Jesus, who was born of the Father before all ages.","[S2]: He is God from God, Light from Light, true God from true God. Begotten, not made.","[S3]: He is consubstantial with the Father; through him all things were made..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
