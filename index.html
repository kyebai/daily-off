<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,2,0]},"psalm":{"title":"Psalm","lines":["[R2]: Generous in love—God, give grace!  Huge in mercy—wipe out my bad record.  Scrub away my guilt, soak out my sins in your laundry.","[R3]: I know how bad I’ve been;  my sins are staring me down.  You’re the One I’ve violated, and you’ve seen it all, seen the full extent of my evil.","[R1]: You have all the facts before you;  whatever you decide about me is fair.  I’ve been out of step with you for a long time, in the wrong since before I was born.","[R2]: What you’re after is truth from the inside out.  Enter me, then;  conceive a new, true life.","[R3]: Soak me in your laundry and I’ll come out clean, scrub me and I’ll have a snow-white life.","[R1]: Tune me in to foot-tapping songs, set these once-broken bones to dancing.  Don’t look too close for blemishes, give me a clean bill of health.","[R2]: God, make a fresh start in me, shape a Genesis week from the chaos of my life.","[R3]: Don’t throw me out with the trash, or fail to breathe holiness in me.  Bring me back from gray exile, put a fresh wind in my sails!","[R1]: Give me a job teaching rebels your ways so the lost can find their way home.  Commute my death sentence, God, my salvation God, and I’ll sing anthems to your life-giving ways.","[R2]: Unbutton my lips, dear God;  I’ll let loose with your praise.  Going through the motions doesn’t please you, a flawless performance is nothing to you.","[R3]: I learned God-worship when my pride was shattered.  Heart-shattered lives ready for love don’t for a moment escape God’s notice.","[R1]: Make Zion the place you delight in, repair Jerusalem’s broken-down walls.  Then you’ll get real worship from us, acts of worship small and large, Including all the bulls they can heave onto your altar! — PSA 51"]},"lesson3":{"title":"Gospel","lines":["[R2]: Now Jesus, full of the Holy Spirit, left the Jordan and was led by the Spirit into the wild.","[R3]: For forty wilderness days and nights he was tested by the Devil.  He ate nothing during those days, and when the time was up he was hungry.","[R1]: The Devil, playing on his hunger, gave the first test: “Since you’re God’s Son, command this stone to turn into a loaf of bread.”","[R2]: Jesus answered by quoting Deuteronomy: “It takes more than bread to really live.”","[R3]: For the second test he led him up and spread out all the kingdoms of the earth on display at once.","[R1]: Then the Devil said, “They’re yours in all their splendor to serve your pleasure.","[R2]: I’m in charge of them all and can turn them over to whomever I wish.  Worship me and they’re yours, the whole works.”","[R3]: Jesus refused, again backing his refusal with Deuteronomy: “Worship the Lord your God and only the Lord your God.","[R1]: Serve him with absolute single-heartedness.”  For the third test the Devil took him to Jerusalem and put him on top of the Temple.","[R2]: He said, “If you are God’s Son, jump.  It’s written, isn’t it, that ‘he has placed you in the care of angels to protect you;","[R3]: they will catch you;  you won’t so much as stub your toe on a stone’?”  “Yes,” said Jesus, “and it’s also written, ‘Don’t you dare tempt the Lord your God.’”","[R1]: That completed the testing.  The Devil retreated temporarily, lying in wait for another opportunity.","[R2]: Jesus returned to Galilee powerful in the Spirit.  News that he was back spread through the countryside.","[R3]: He taught in their meeting places to everyone’s acclaim and pleasure.  He came to Nazareth where he had been raised.","[R1]: As he always did on the Sabbath, he went to the meeting place.  When he stood up to read, he was handed the scroll of the prophet Isaiah.","[R2]: Unrolling the scroll, he found the place where it was written, God’s Spirit is on me;","[R3]: he’s chosen me to preach the Message of good news to the poor, Sent me to announce pardon to prisoners and recovery of sight to the blind, To set the burdened and battered free, to announce, “This is God’s time to shine!”","[R1]: He rolled up the scroll, handed it back to the assistant, and sat down.  Every eye in the place was on him, intent.","[R2]: Then he started in, “You’ve just heard Scripture make history.  It came true just now in this place.”","[R3]: All who were there, watching and listening, were surprised at how well he spoke.","[R1]: But they also said, “Isn’t this Joseph’s son, the one we’ve known since he was just a kid?”","[R2]: He answered, “I suppose you’re going to quote the proverb, ‘Doctor, go heal yourself.","[R3]: Do here in your hometown what we heard you did in Capernaum.’  Well, let me tell you something: No prophet is ever welcomed in his hometown.","[R1]: Isn’t it a fact that there were many widows in Israel at the time of Elijah during that three and a half years of drought when famine devastated the land, but the only widow to whom Elijah was sent was in Sarepta in Sidon?","[R2]: And there were many lepers in Israel at the time of the prophet Elisha but the only one cleansed was Naaman the Syrian.”","[R3]: That set everyone in the meeting place seething with anger.  They threw him out, banishing him from the village, then took him to a mountain cliff at the edge of the village to throw him to his doom, but he gave them the slip and was on his way. — LUK 4"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you King Jesus for breaking the power of death, rising again on the third day in accordance with the Scriptures.","[S2]: Then you ascended into heaven, where you still sit at the right hand of the Father.","[S3]: But you will come again in glory to judge the living and the dead. Your kingdom will have no end..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
