<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: A long time ago you spoke in a vision, you spoke to your faithful beloved: “I’ve crowned a hero, I chose the best I could find;","[R2]: I found David, my servant, poured holy oil on his head, And I’ll keep my hand steadily on him, yes, I’ll stick with him through thick and thin.","[R3]: No enemy will get the best of him, no scoundrel will do him in.  I’ll weed out all who oppose him, I’ll clean out all who hate him.","[R1]: I’m with him for good and I’ll love him forever;  I’ve set him on high—he’s riding high!","[R2]: I’ve put Ocean in his one hand, River in the other;  he’ll call out, ‘Oh, my Father—my God, my Rock of Salvation!’","[R3]: Yes, I’m setting him apart as the First of the royal line, High King over all of earth’s kings.","[R1]: I’ll preserve him eternally in my love, I’ll faithfully do all I so solemnly promised.","[R2]: I’ll guarantee his family tree and underwrite his rule.  If his children refuse to do what I tell them, if they refuse to walk in the way I show them, If they spit on the directions I give them and tear up the rules I post for them— I’ll rub their faces in the dirt of their rebellion and make them face the music.","[R3]: But I’ll never throw them out, never abandon or disown them.  Do you think I’d withdraw my holy promise?","[R1]: or take back words I’d already spoken?  I’ve given my word, my whole and holy word;","[R2]: do you think I would lie to David?  His family tree is here for good, his sovereignty as sure as the sun, Dependable as the phases of the moon, inescapable as weather.”","[R3]: But God, you did walk off and leave us, you lost your temper with the one you anointed.","[R1]: You tore up the promise you made to your servant, you stomped his crown in the mud.","[R2]: You blasted his home to kingdom come, reduced his city to a pile of rubble Picked clean by wayfaring strangers, a joke to all the neighbors.","[R3]: You declared a holiday for all his enemies, and they’re celebrating for all they’re worth.","[R1]: Angry, you opposed him in battle, refused to fight on his side;  You robbed him of his splendor, humiliated this warrior, ground his kingly honor in the dirt.","[R2]: You took the best years of his life and left him an impotent, ruined husk.  How long do we put up with this, God?","[R3]: Are you gone for good?  Will you hold this grudge forever?  Remember my sorrow and how short life is.","[R1]: Did you create men and women for nothing but this?  We’ll see death soon enough.","[R2]: Everyone does.  And there’s no back door out of hell.  So where is the love you’re so famous for, Lord?","[R3]: What happened to your promise to David?  Take a good look at your servant, dear Lord;","[R1]: I’m the butt of the jokes of all nations, The taunting jokes of your enemies, God, as they dog the steps of your dear anointed.","[R2]: Blessed be God forever and always!  Yes.  Oh, yes. — PSA 89"]},"lesson3":{"title":"Gospel","lines":["[R1]: “Following those hard times, Sun will fade out, moon cloud over, Stars fall out of the sky, cosmic powers tremble.","[R2]: “Then, the Arrival of the Son of Man!  It will fill the skies—no one will miss it.","[R3]: Unready people all over the world, outsiders to the splendor and power, will raise a huge lament as they watch the Son of Man blazing out of heaven.","[R1]: At that same moment, he’ll dispatch his angels with a trumpet-blast summons, pulling in God’s chosen from the four winds, from pole to pole.","[R2]: “Take a lesson from the fig tree.  From the moment you notice its buds form, the merest hint of green, you know summer’s just around the corner.","[R3]: So it is with you: When you see all these things, you’ll know he’s at the door.","[R1]: Don’t take this lightly.  I’m not just saying this for some future generation, but for all of you.","[R2]: This age continues until all these things take place.  Sky and earth will wear out;","[R3]: my words won’t wear out.  “But the exact day and hour?  No one knows that, not even heaven’s angels, not even the Son.","[R1]: Only the Father knows.  “The Arrival of the Son of Man will take place in times like Noah’s.","[R2]: Before the great flood everyone was carrying on as usual, having a good time right up to the day Noah boarded the ark.","[R3]: They knew nothing—until the flood hit and swept everything away.  “The Son of Man’s Arrival will be like that: Two men will be working in the field—one will be taken, one left behind;","[R1]: two women will be grinding at the mill—one will be taken, one left behind.  So stay awake, alert.","[R2]: You have no idea what day your Master will show up.  But you do know this: You know that if the homeowner had known what time of night the burglar would arrive, he would have been there with his dogs to prevent the break-in.","[R3]: Be vigilant just like that.  You have no idea when the Son of Man is going to show up.","[R1]: “Who here qualifies for the job of overseeing the kitchen?  A person the Master can depend on to feed the workers on time each day.","[R2]: Someone the Master can drop in on unannounced and always find him doing his job.","[R3]: A God-blessed man or woman, I tell you.  It won’t be long before the Master will put this person in charge of the whole operation.","[R1]: “But if that person only looks out for himself, and the minute the Master is away does what he pleases—abusing the help and throwing drunken parties for his friends—the Master is going to show up when he least expects it, and it won’t be pretty.","[R2]: He’ll end up in the dump with the hypocrites, out in the cold shivering, teeth chattering.” — MAT 24"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for disclosing yourself as the one God.","[S2]: You are Father almighty, maker of heaven and earth, of all things visible and invisible,","[S3]: You begot one Lord, Jesus Christ, your only Son..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
