<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,1,0]},"psalm":{"title":"Psalm","lines":["[R3]: You know how they kick me around— Pin on me the donkey’s ears, the dunce’s cap.","[R2]: I’m broken by their taunts, Flat on my face, reduced to a nothing.  I looked in vain for one friendly face.","[R1]: Not one.  I couldn’t find one shoulder to cry on.  They put poison in my soup, Vinegar in my drink.","[R3]: Let their supper be bait in a trap that snaps shut;  May their best friends be trappers who’ll skin them alive.","[R2]: Make them become blind as bats, Give them the shakes from morning to night.  Let them know what you think of them, Blast them with your red-hot anger.","[R1]: Burn down their houses, Leave them desolate with nobody at home.  They gossiped about the one you disciplined, Made up stories about anyone wounded by God.","[R3]: Pile on the guilt, Don’t let them off the hook.  Strike their names from the list of the living;","[R2]: No rock-carved honor for them among the righteous.  I’m hurt and in pain;  Give me space for healing, and mountain air.","[R1]: Let me shout God’s name with a praising song, Let me tell his greatness in a prayer of thanks.","[R3]: For God, this is better than oxen on the altar, Far better than blue-ribbon bulls.","[R2]: The poor in spirit see and are glad— Oh, you God-seekers, take heart!  For God listens to the poor, He doesn’t walk out on the wretched.","[R1]: You heavens, praise him;  praise him, earth;  Also ocean and all things that swim in it.","[R3]: For God is out to help Zion, Rebuilding the wrecked towns of Judah.  Guess who will live there— The proud owners of the land?","[R2]: No, the children of his servants will get it, The lovers of his name will live in it. — PSA 69"]},"lesson3":{"title":"Gospel","lines":["[R3]: He quoted a proverb: “‘Can a blind man guide a blind man?’  Wouldn’t they both end up in the ditch?","[R2]: An apprentice doesn’t lecture the master.  The point is to be careful who you follow as your teacher.","[R1]: “It’s easy to see a smudge on your neighbor’s face and be oblivious to the ugly sneer on your own.","[R3]: Do you have the nerve to say, ‘Let me wash your face for you,’ when your own face is distorted by contempt?","[R2]: It’s this I-know-better-than-you mentality again, playing a holier-than-thou part instead of just living your own part.","[R1]: Wipe that ugly sneer off your own face and you might be fit to offer a washcloth to your neighbor.","[R3]: “You don’t get wormy apples off a healthy tree, nor good apples off a diseased tree.","[R2]: The health of the apple tells the health of the tree.  You must begin with your own life-giving lives.","[R1]: It’s who you are, not what you say and do, that counts.  Your true being brims over into true words and deeds.","[R3]: “Why are you so polite with me, always saying ‘Yes, sir,’ and ‘That’s right, sir,’ but never doing a thing I tell you?","[R2]: These words I speak to you are not mere additions to your life, homeowner improvements to your standard of living.","[R1]: They are foundation words, words to build a life on.  “If you work the words into your life, you are like a smart carpenter who dug deep and laid the foundation of his house on bedrock.","[R3]: When the river burst its banks and crashed against the house, nothing could shake it;","[R2]: it was built to last.  But if you just use my words in Bible studies and don’t work them into your life, you are like a dumb carpenter who built a house but skipped the foundation.","[R1]: When the swollen river came crashing in, it collapsed like a house of cards.  It was a total loss.”","[R3]: When he finished speaking to the people, he entered Capernaum.  A Roman captain there had a servant who was on his deathbed.","[R2]: He prized him highly and didn’t want to lose him.  When he heard Jesus was back, he sent leaders from the Jewish community asking him to come and heal his servant.","[R1]: They came to Jesus and urged him to do it, saying, “He deserves this.  He loves our people.","[R3]: He even built our meeting place.”  Jesus went with them.  When he was still quite far from the house, the captain sent friends to tell him, “Master, you don’t have to go to all this trouble.","[R2]: I’m not that good a person, you know.  I’d be embarrassed for you to come to my house, even embarrassed to come to you in person.","[R1]: Just give the order and my servant will get well.  I’m a man under orders;  I also give orders.","[R3]: I tell one soldier, ‘Go,’ and he goes;  another, ‘Come,’ and he comes;  my slave, ‘Do this,’ and he does it.”","[R2]: Taken aback, Jesus addressed the accompanying crowd: “I’ve yet to come across this kind of simple trust anywhere in Israel, the very people who are supposed to know about God and how he works.”","[R1]: When the messengers got back home, they found the servant up and well. — LUK 6"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: We live in gratitude that our King came down from heaven for our salvation.","[S2]: The Holy Spirit empowered his incarnation by the Virgin Mary to become a man.","[S3]: For us he was crucified under Pontius Pilate, he suffered death and was buried..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
