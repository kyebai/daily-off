<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,1,0]},"psalm":{"title":"Psalm","lines":["[R3]: “They’ve kicked me around ever since I was young” —this is how Israel tells it— “They’ve kicked me around ever since I was young, but they never could keep me down.","[R2]: Their plowmen plowed long furrows up and down my back;  But God wouldn’t put up with it, he sticks with us.","[R1]: Then God ripped the harnesses of the evil plowmen to shreds.”  Oh, let all those who hate Zion grovel in humiliation;","[R3]: Let them be like grass in shallow ground that withers before the harvest, Before the farmhands can gather it in, the harvesters get in the crop, Before the neighbors have a chance to call out, “Congratulations on your wonderful crop!","[R2]: We bless you in God’s name!”  Help, God—I’ve hit rock bottom!  Master, hear my cry for help!","[R1]: Listen hard!  Open your ears!  Listen to my cries for mercy.  If you, God, kept records on wrongdoings, who would stand a chance?","[R3]: As it turns out, forgiveness is your habit, and that’s why you’re worshiped.  I pray to God—my life a prayer— and wait for what he’ll say and do.","[R2]: My life’s on the line before God, my Lord, waiting and watching till morning, waiting and watching till morning.","[R1]: O Israel, wait and watch for God— with God’s arrival comes love, with God’s arrival comes generous redemption.","[R3]: No doubt about it—he’ll redeem Israel, buy back Israel from captivity to sin.  God, I’m not trying to rule the roost, I don’t want to be king of the mountain.","[R2]: I haven’t meddled where I have no business or fantasized grandiose plans.  I’ve kept my feet on the ground, I’ve cultivated a quiet heart.","[R1]: Like a baby content in its mother’s arms, my soul is a baby content.  Wait, Israel, for God.","[R3]: Wait with hope.  Hope now;  hope always! — PSA 129"]},"lesson3":{"title":"Gospel","lines":["[R3]: He left there and returned to his hometown.  His disciples came along.  On the Sabbath, he gave a lecture in the meeting place.","[R2]: He stole the show, impressing everyone.  “We had no idea he was this good!”  they said.","[R1]: “How did he get so wise all of a sudden, get such ability?”  But in the next breath they were cutting him down: “He’s just a carpenter—Mary’s boy.","[R3]: We’ve known him since he was a kid.  We know his brothers, James, Justus, Jude, and Simon, and his sisters.","[R2]: Who does he think he is?”  They tripped over what little they knew about him and fell, sprawling.","[R1]: And they never got any further.  Jesus told them, “A prophet has little honor in his hometown, among his relatives, on the streets he played in as a child.”","[R3]: Jesus wasn’t able to do much of anything there—he laid hands on a few sick people and healed them, that’s all.","[R2]: He couldn’t get over their stubbornness.  He left and made a circuit of the other villages, teaching.","[R1]: Jesus called the Twelve to him, and sent them out in pairs.  He gave them authority and power to deal with the evil opposition.","[R3]: He sent them off with these instructions: “Don’t think you need a lot of extra equipment for this.","[R2]: You are the equipment.  No special appeals for funds.  Keep it simple.  “And no luxury inns.","[R1]: Get a modest place and be content there until you leave.  “If you’re not welcomed, not listened to, quietly withdraw.","[R3]: Don’t make a scene.  Shrug your shoulders and be on your way.”  Then they were on the road.","[R2]: They preached with joyful urgency that life can be radically different;  right and left they sent the demons packing;","[R1]: they brought wellness to the sick, anointing their bodies, healing their spirits.","[R3]: King Herod heard of all this, for by this time the name of Jesus was on everyone’s lips.","[R2]: He said, “This has to be John the Baptizer come back from the dead—that’s why he’s able to work miracles!”","[R1]: Others said, “No, it’s Elijah.”  Others said, “He’s a prophet, just like one of the old-time prophets.”","[R3]: But Herod wouldn’t budge: “It’s John, sure enough.  I cut off his head, and now he’s back, alive.”","[R2]: Herod was the one who had ordered the arrest of John, put him in chains, and sent him to prison at the nagging of Herodias, his brother Philip’s wife.","[R1]: For John had provoked Herod by naming his relationship with Herodias “adultery.”","[R3]: Herodias, smoldering with hate, wanted to kill him, but didn’t dare because Herod was in awe of John.","[R2]: Convinced that he was a holy man, he gave him special treatment.  Whenever he listened to him he was miserable with guilt—and yet he couldn’t stay away.","[R1]: Something in John kept pulling him back.  But a portentous day arrived when Herod threw a birthday party, inviting all the brass and bluebloods in Galilee.","[R3]: Herodias’s daughter entered the banquet hall and danced for the guests.  She charmed Herod and the guests.","[R2]: The king said to the girl, “Ask me anything.  I’ll give you anything you want.”","[R1]: Carried away, he kept on, “I swear, I’ll split my kingdom with you if you say so!”","[R3]: She went back to her mother and said, “What should I ask for?”  “Ask for the head of John the Baptizer.”","[R2]: Excited, she ran back to the king and said, “I want the head of John the Baptizer served up on a platter.","[R1]: And I want it now!”  That sobered the king up fast.  But unwilling to lose face with his guests, he caved in and let her have her wish.","[R3]: The king sent the executioner off to the prison with orders to bring back John’s head.","[R2]: He went, cut off John’s head, brought it back on a platter, and presented it to the girl, who gave it to her mother.","[R1]: When John’s disciples heard about this, they came and got the body and gave it a decent burial. — MRK 6"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you Father for your Holy Spirit, the Lord, the giver of life.","[S2]: Who proceeds from you and the Son, with you both is adored and glorified.","[S3]: Who spoke through the prophets, shaping our story and mission in Holy Scripture..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
