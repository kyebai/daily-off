<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,2,0]},"psalm":{"title":"Psalm","lines":["[R2]: God, you’re my last chance of the day.  I spend the night on my knees before you.","[R3]: Put me on your salvation agenda;  take notes on the trouble I’m in.  I’ve had my fill of trouble;","[R1]: I’m camped on the edge of hell.  I’m written off as a lost cause, one more statistic, a hopeless case.","[R2]: Abandoned as already dead, one more body in a stack of corpses, And not so much as a gravestone— I’m a black hole in oblivion.","[R3]: You’ve dropped me into a bottomless pit, sunk me in a pitch-black abyss.  I’m battered senseless by your rage, relentlessly pounded by your waves of anger.","[R1]: You turned my friends against me, made me horrible to them.  I’m caught in a maze and can’t find my way out, blinded by tears of pain and frustration.","[R2]: I call to you, God;  all day I call.  I wring my hands, I plead for help.  Are the dead a live audience for your miracles?","[R3]: Do ghosts ever join the choirs that praise you?  Does your love make any difference in a graveyard?","[R1]: Is your faithful presence noticed in the corridors of hell?  Are your marvelous wonders ever seen in the dark, your righteous ways noticed in the Land of No Memory?","[R2]: I’m standing my ground, God, shouting for help, at my prayers every morning, on my knees each daybreak.","[R3]: Why, God, do you turn a deaf ear?  Why do you make yourself scarce?  For as long as I remember I’ve been hurting;","[R1]: I’ve taken the worst you can hand out, and I’ve had it.  Your wildfire anger has blazed through my life;","[R2]: I’m bleeding, black-and-blue.  You’ve attacked me fiercely from every side, raining down blows till I’m nearly dead.","[R3]: You made lover and neighbor alike dump me;  the only friend I have left is Darkness. — PSA 88"]},"lesson3":{"title":"Gospel","lines":["[R2]: Jesus then left the Temple.  As he walked away, his disciples pointed out how very impressive the Temple architecture was.","[R3]: Jesus said, “You’re not impressed by all this sheer size, are you?  The truth of the matter is that there’s not a stone in that building that is not going to end up in a pile of rubble.”","[R1]: Later as he was sitting on Mount Olives, his disciples approached and asked him, “Tell us, when are these things going to happen?","[R2]: What will be the sign of your coming, that the time’s up?”  Jesus said, “Watch out for doomsday deceivers.","[R3]: Many leaders are going to show up with forged identities, claiming, ‘I am Christ, the Messiah.’","[R1]: They will deceive a lot of people.  When reports come in of wars and rumored wars, keep your head and don’t panic.","[R2]: This is routine history;  this is no sign of the end.  Nation will fight nation and ruler fight ruler, over and over.","[R3]: Famines and earthquakes will occur in various places.  This is nothing compared to what is coming.","[R1]: “They are going to throw you to the wolves and kill you, everyone hating you because you carry my name.","[R2]: And then, going from bad to worse, it will be dog-eat-dog, everyone at each other’s throat, everyone hating each other.","[R3]: “In the confusion, lying preachers will come forward and deceive a lot of people.","[R1]: For many others, the overwhelming spread of evil will do them in—nothing left of their love but a mound of ashes.","[R2]: “Staying with it—that’s what God requires.  Stay with it to the end.  You won’t be sorry, and you’ll be saved.","[R3]: All during this time, the good news—the Message of the kingdom—will be preached all over the world, a witness staked out in every country.","[R1]: And then the end will come.  “But be ready to run for it when you see the monster of desecration set up in the Temple sanctuary.","[R2]: The prophet Daniel described this.  If you’ve read Daniel, you’ll know what I’m talking about.","[R3]: If you’re living in Judea at the time, run for the hills;  if you’re working in the yard, don’t return to the house to get anything;","[R1]: if you’re out in the field, don’t go back and get your coat.  Pregnant and nursing mothers will have it especially hard.","[R2]: Hope and pray this won’t happen during the winter or on a Sabbath.  “This is going to be trouble on a scale beyond what the world has ever seen, or will see again.","[R3]: If these days of trouble were left to run their course, nobody would make it.  But on account of God’s chosen people, the trouble will be cut short.","[R1]: “If anyone tries to flag you down, calling out, ‘Here’s the Messiah!’  or points, ‘There he is!’","[R2]: don’t fall for it.  Fake Messiahs and lying preachers are going to pop up everywhere.","[R3]: Their impressive credentials and bewitching performances will pull the wool over the eyes of even those who ought to know better.","[R1]: But I’ve given you fair warning.  “So if they say, ‘Run to the country and see him arrive!’","[R2]: or, ‘Quick, get downtown, see him come!’  don’t give them the time of day.  The Arrival of the Son of Man isn’t something you go to see.","[R3]: He comes like swift lightning to you!  Whenever you see crowds gathering, think of carrion vultures circling, moving in, hovering over a rotting carcass.","[R1]: You can be quite sure that it’s not the living Son of Man pulling in those crowds. — MAT 24"]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
