<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,0,2]},"psalm":{"title":"Psalm","lines":["[R2]: God made my life complete when I placed all the pieces before him.  When I got my act together, he gave me a fresh start.","[R1]: Now I’m alert to God’s ways;  I don’t take God for granted.  Every day I review the ways he works;","[R3]: I try not to miss a trick.  I feel put back together, and I’m watching my step.","[R2]: God rewrote the text of my life when I opened the book of my heart to his eyes.","[R1]: The good people taste your goodness, The whole people taste your health, The true people taste your truth, The bad ones can’t figure you out.","[R3]: You take the side of the down-and-out, But the stuck-up you take down a notch.","[R2]: Suddenly, God, you floodlight my life;  I’m blazing with glory, God’s glory!  I smash the bands of marauders, I vault the highest fences.","[R1]: What a God!  His road stretches straight and smooth.  Every God-direction is road-tested.","[R3]: Everyone who runs toward him Makes it.  Is there any god like God?  Are we not at bedrock?","[R2]: Is not this the God who armed me, then aimed me in the right direction?  Now I run like a deer;","[R1]: I’m king of the mountain.  He shows me how to fight;  I can bend a bronze bow!","[R3]: You protect me with salvation-armor;  you hold me up with a firm hand, caress me with your gentle ways.","[R2]: You cleared the ground under me so my footing was firm.  When I chased my enemies I caught them;","[R1]: I didn’t let go till they were dead men.  I nailed them;  they were down for good;","[R3]: then I walked all over them.  You armed me well for this fight, you smashed the upstarts.","[R2]: You made my enemies turn tail, and I wiped out the haters.  They cried “uncle” but Uncle didn’t come;","[R1]: They yelled for God and got no for an answer.  I ground them to dust;  they gusted in the wind.","[R3]: I threw them out, like garbage in the gutter.  You rescued me from a squabbling people;","[R2]: you made me a leader of nations.  People I’d never heard of served me;  the moment they got wind of me they listened.","[R1]: The foreign devils gave up;  they came on their bellies, crawling from their hideouts.","[R3]: Live, God!  Blessings from my Rock, my free and freeing God, towering!  This God set things right for me and shut up the people who talked back.","[R2]: He rescued me from enemy anger, he pulled me from the grip of upstarts, He saved me from the bullies.","[R1]: That’s why I’m thanking you, God, all over the world.  That’s why I’m singing songs that rhyme your name.","[R3]: God’s king takes the trophy;  God’s chosen is beloved.  I mean David and all his children— always. — PSA 18"]},"lesson3":{"title":"Gospel","lines":["[R2]: “But be ready to run for it when you see the monster of desecration set up where it should never be.","[R1]: You who can read, make sure you understand what I’m talking about.  If you’re living in Judea at the time, run for the hills;","[R3]: if you’re working in the yard, don’t go back to the house to get anything;  if you’re out in the field, don’t go back to get your coat.","[R2]: Pregnant and nursing mothers will have it especially hard.  Hope and pray this won’t happen in the middle of winter.","[R1]: “These are going to be hard days—nothing like it from the time God made the world right up to the present.","[R3]: And there’ll be nothing like it again.  If he let the days of trouble run their course, nobody would make it.","[R2]: But because of God’s chosen people, those he personally chose, he has already intervened.","[R1]: “If anyone tries to flag you down, calling out, ‘Here’s the Messiah!’  or points, ‘There he is!’","[R3]: don’t fall for it.  Fake Messiahs and lying preachers are going to pop up everywhere.","[R2]: Their impressive credentials and bewitching performances will pull the wool over the eyes of even those who ought to know better.","[R1]: So watch out.  I’ve given you fair warning.  “Following those hard times, Sun will fade out, moon cloud over, Stars fall out of the sky, cosmic powers tremble.","[R3]: “And then they’ll see the Son of Man enter in grand style, his Arrival filling the sky—no one will miss it!","[R2]: He’ll dispatch the angels;  they will pull in the chosen from the four winds, from pole to pole.","[R1]: “Take a lesson from the fig tree.  From the moment you notice its buds form, the merest hint of green, you know summer’s just around the corner.","[R3]: And so it is with you.  When you see all these things, you know he is at the door.","[R2]: Don’t take this lightly.  I’m not just saying this for some future generation, but for this one, too—these things will happen.","[R1]: Sky and earth will wear out;  my words won’t wear out.  “But the exact day and hour?","[R3]: No one knows that, not even heaven’s angels, not even the Son.  Only the Father.","[R2]: So keep a sharp lookout, for you don’t know the timetable.  It’s like a man who takes a trip, leaving home and putting his servants in charge, each assigned a task, and commanding the gatekeeper to stand watch.","[R1]: So, stay at your post, watching.  You have no idea when the homeowner is returning, whether evening, midnight, cockcrow, or morning.","[R3]: You don’t want him showing up unannounced, with you asleep on the job.  I say it to you, and I’m saying it to all: Stay at your post.","[R2]: Keep watch.” — MRK 13"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you Father for your Holy Spirit, the Lord, the giver of life.","[S2]: Who proceeds from you and the Son, with you both is adored and glorified.","[S3]: Who spoke through the prophets, shaping our story and mission in Holy Scripture..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
