<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,0,2]},"psalm":{"title":"Psalm","lines":["[R2]: Harass these hecklers, God, punch these bullies in the nose.  Grab a weapon, anything at hand;","[R1]: stand up for me!  Get ready to throw the spear, aim the javelin, at the people who are out to get me.","[R3]: Reassure me;  let me hear you say, “I’ll save you.”  When those thugs try to knife me in the back, make them look foolish.","[R2]: Frustrate all those who are plotting my downfall.  Make them like cinders in a high wind, with God’s angel working the bellows.","[R1]: Make their road lightless and mud-slick, with God’s angel on their tails.  Out of sheer cussedness they set a trap to catch me;","[R3]: for no good reason they dug a ditch to stop me.  Surprise them with your ambush— catch them in the very trap they set, the disaster they planned for me.","[R2]: But let me run loose and free, celebrating God’s great work, Every bone in my body laughing, singing, “God, there’s no one like you.","[R1]: You put the down-and-out on their feet and protect the unprotected from bullies!”","[R3]: Hostile accusers appear out of nowhere, they stand up and badger me.  They pay me back misery for mercy, leaving my soul empty.","[R2]: When they were sick, I dressed in black;  instead of eating, I prayed.  My prayers were like lead in my gut, like I’d lost my best friend, my brother.","[R1]: I paced, distraught as a motherless child, hunched and heavyhearted.  But when I was down they threw a party!","[R3]: All the nameless misfits of the town came chanting insults about me.  Like barbarians desecrating a shrine, they destroyed my reputation.","[R2]: God, how long are you going to stand there doing nothing?  Save me from their brutalities;","[R1]: everything I’ve got is being thrown to the lions.  I will give you full credit when everyone gathers for worship;","[R3]: When the people turn out in force I will say my Hallelujahs.  Don’t let these liars, my enemies, have a party at my expense, Those who hate me for no reason, winking and rolling their eyes.","[R2]: No good is going to come from that crowd;  They spend all their time cooking up gossip against those who mind their own business.","[R1]: They open their mouths in ugly grins, Mocking, “Ha-ha, ha-ha, thought you’d get away with it?","[R3]: We’ve caught you hands down!”  Don’t you see what they’re doing, God?  You’re not going to let them Get by with it, are you?","[R2]: Not going to walk off without doing something, are you?  Please get up—wake up!","[R1]: Tend to my case.  My God, my Lord—my life is on the line.  Do what you think is right, God, my God, but don’t make me pay for their good time.","[R3]: Don’t let them say to themselves, “Ha-ha, we got what we wanted.”  Don’t let them say, “We’ve chewed him up and spit him out.”","[R2]: Let those who are being hilarious at my expense Be made to look ridiculous.  Make them wear donkey’s ears;","[R1]: Pin them with the donkey’s tail, who made themselves so high and mighty!  But those who want the best for me, Let them have the last word—a glad shout!","[R3]: — and say, over and over and over, “God is great—everything works together for good for his servant.”","[R2]: I’ll tell the world how great and good you are, I’ll shout Hallelujah all day, every day. — PSA 35"]},"lesson3":{"title":"Gospel","lines":["[R2]: So many others have tried their hand at putting together a story of the wonderful harvest of Scripture and history that took place among us, using reports handed down by the original eyewitnesses who served this Word with their very lives.","[R1]: Since I have investigated all the reports in close detail, starting from the story’s beginning, I decided to write it all out for you, most honorable Theophilus, so you can know beyond the shadow of a doubt the reliability of what you were taught.","[R3]: During the rule of Herod, King of Judea, there was a priest assigned service in the regiment of Abijah.","[R2]: His name was Zachariah.  His wife was descended from the daughters of Aaron.  Her name was Elizabeth.","[R1]: Together they lived honorably before God, careful in keeping to the ways of the commandments and enjoying a clear conscience before God.","[R3]: But they were childless because Elizabeth could never conceive, and now they were quite old.","[R2]: It so happened that as Zachariah was carrying out his priestly duties before God, working the shift assigned to his regiment, it came his one turn in life to enter the sanctuary of God and burn incense.","[R1]: The congregation was gathered and praying outside the Temple at the hour of the incense offering.","[R3]: Unannounced, an angel of God appeared just to the right of the altar of incense.","[R2]: Zachariah was paralyzed in fear.  But the angel reassured him, “Don’t fear, Zachariah.","[R1]: Your prayer has been heard.  Elizabeth, your wife, will bear a son by you.  You are to name him John.","[R3]: You’re going to leap like a gazelle for joy, and not only you—many will delight in his birth.","[R2]: He’ll achieve great stature with God.  “He’ll drink neither wine nor beer.  He’ll be filled with the Holy Spirit from the moment he leaves his mother’s womb.","[R1]: He will turn many sons and daughters of Israel back to their God.  He will herald God’s arrival in the style and strength of Elijah, soften the hearts of parents to children, and kindle devout understanding among hardened skeptics—he’ll get the people ready for God.”","[R3]: Zachariah said to the angel, “Do you expect me to believe this?  I’m an old man and my wife is an old woman.”","[R2]: But the angel said, “I am Gabriel, the sentinel of God, sent especially to bring you this glad news.","[R1]: But because you won’t believe me, you’ll be unable to say a word until the day of your son’s birth.","[R3]: Every word I’ve spoken to you will come true on time—God’s time.”  Meanwhile, the congregation waiting for Zachariah was getting restless, wondering what was keeping him so long in the sanctuary.","[R2]: When he came out and couldn’t speak, they knew he had seen a vision.  He continued speechless and had to use sign language with the people.","[R1]: When the course of his priestly assignment was completed, he went back home.  It wasn’t long before his wife, Elizabeth, conceived.","[R3]: She went off by herself for five months, relishing her pregnancy.  “So, this is how God acts to remedy my unfortunate condition!”","[R2]: she said. — LUK 1"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you King Jesus for breaking the power of death, rising again on the third day in accordance with the Scriptures.","[S2]: Then you ascended into heaven, where you still sit at the right hand of the Father.","[S3]: But you will come again in glory to judge the living and the dead. Your kingdom will have no end..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
