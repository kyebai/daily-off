<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: God, you smiled on your good earth!  You brought good times back to Jacob!  You lifted the cloud of guilt from your people, you put their sins far out of sight.","[R2]: You took back your sin-provoked threats, you cooled your hot, righteous anger.","[R3]: Help us again, God of our help;  don’t hold a grudge against us forever.  You aren’t going to keep this up, are you?","[R1]: scowling and angry, year after year?  Why not help us make a fresh start—a resurrection life?","[R2]: Then your people will laugh and sing!  Show us how much you love us, God!  Give us the salvation we need!","[R3]: I can’t wait to hear what he’ll say.  God’s about to pronounce his people well, The holy people he loves so much, so they’ll never again live like fools.","[R1]: See how close his salvation is to those who fear him?  Our country is home base for Glory!","[R2]: Love and Truth meet in the street, Right Living and Whole Living embrace and kiss!","[R3]: Truth sprouts green from the ground, Right Living pours down from the skies!  Oh yes!","[R1]: God gives Goodness and Beauty;  our land responds with Bounty and Blessing.  Right Living strides out before him, and clears a path for his passage. — PSA 85"]},"lesson3":{"title":"Gospel","lines":["[R1]: “I’ve had it with you!  You’re hopeless, you religion scholars, you Pharisees!  Frauds!","[R2]: Your lives are roadblocks to God’s kingdom.  You refuse to enter, and won’t let anyone else in either.","[R3]: “You’re hopeless, you religion scholars and Pharisees!  Frauds!  You go halfway around the world to make a convert, but once you get him you make him into a replica of yourselves, double-damned.","[R1]: “You’re hopeless!  What arrogant stupidity!  You say, ‘If someone makes a promise with his fingers crossed, that’s nothing;","[R2]: but if he swears with his hand on the Bible, that’s serious.’  What ignorance!","[R3]: Does the leather on the Bible carry more weight than the skin on your hands?  And what about this piece of trivia: ‘If you shake hands on a promise, that’s nothing;","[R1]: but if you raise your hand that God is your witness, that’s serious’?  What ridiculous hairsplitting!","[R2]: What difference does it make whether you shake hands or raise hands?  A promise is a promise.","[R3]: What difference does it make if you make your promise inside or outside a house of worship?","[R1]: A promise is a promise.  God is present, watching and holding you to account regardless.","[R2]: “You’re hopeless, you religion scholars and Pharisees!  Frauds!  You keep meticulous account books, tithing on every nickel and dime you get, but on the meat of God’s Law, things like fairness and compassion and commitment—the absolute basics!","[R3]: —you carelessly take it or leave it.  Careful bookkeeping is commendable, but the basics are required.","[R1]: Do you have any idea how silly you look, writing a life story that’s wrong from start to finish, nitpicking over commas and semicolons?","[R2]: “You’re hopeless, you religion scholars and Pharisees!  Frauds!  You buff the surface of your cups and bowls so they sparkle in the sun, while the insides are maggoty with your greed and gluttony.","[R3]: Stupid Pharisee!  Scour the insides, and then the gleaming surface will mean something.","[R1]: “You’re hopeless, you religion scholars and Pharisees!  Frauds!  You’re like manicured grave plots, grass clipped and the flowers bright, but six feet down it’s all rotting bones and worm-eaten flesh.","[R2]: People look at you and think you’re saints, but beneath the skin you’re total frauds.","[R3]: “You’re hopeless, you religion scholars and Pharisees!  Frauds!  You build granite tombs for your prophets and marble monuments for your saints.","[R1]: And you say that if you had lived in the days of your ancestors, no blood would have been on your hands.","[R2]: You protest too much!  You’re cut from the same cloth as those murderers, and daily add to the death count.","[R3]: “Snakes!  Cold-blooded sneaks!  Do you think you can worm your way out of this?","[R1]: Never have to pay the piper?  It’s on account of people like you that I send prophets and wise guides and scholars generation after generation—and generation after generation you treat them like dirt, greeting them with lynch mobs, hounding them with abuse.","[R2]: “You can’t squirm out of this: Every drop of righteous blood ever spilled on this earth, beginning with the blood of that good man Abel right down to the blood of Zechariah, Barachiah’s son, whom you murdered at his prayers, is on your head.","[R3]: All this, I’m telling you, is coming down on you, on your generation.  “Jerusalem!","[R1]: Jerusalem!  Murderer of prophets!  Killer of the ones who brought you God’s news!","[R2]: How often I’ve ached to embrace your children, the way a hen gathers her chicks under her wings, and you wouldn’t let me.","[R3]: And now you’re so desolate, nothing but a ghost town.  What is there left to say?","[R1]: Only this: I’m out of here soon.  The next time you see me you’ll say, ‘Oh, God has blessed him!","[R2]: He’s come, bringing God’s rule!’” — MAT 23"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for your one, holy, catholic and apostolic Church.","[S2]: Where we confess one Baptism for the forgiveness of sins,","[S3]: And look forward to the resurrection of the dead and the life of the age to come."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
