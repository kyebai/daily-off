<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,0,2]},"psalm":{"title":"Psalm","lines":["[R2]: I lift you high in praise, my God, O my King!  and I’ll bless your name into eternity.","[R1]: I’ll bless you every day, and keep it up from now to eternity.  God is magnificent;","[R3]: he can never be praised enough.  There are no boundaries to his greatness.  Generation after generation stands in awe of your work;","[R2]: each one tells stories of your mighty acts.  Your beauty and splendor have everyone talking;","[R1]: I compose songs on your wonders.  Your marvelous doings are headline news;  I could write a book full of the details of your greatness.","[R3]: The fame of your goodness spreads across the country;  your righteousness is on everyone’s lips.","[R2]: God is all mercy and grace— not quick to anger, is rich in love.  God is good to one and all;","[R1]: everything he does is soaked through with grace.  Creation and creatures applaud you, God;","[R3]: your holy people bless you.  They talk about the glories of your rule, they exclaim over your splendor, Letting the world know of your power for good, the lavish splendor of your kingdom.","[R2]: Your kingdom is a kingdom eternal;  you never get voted out of office.  God always does what he says, and is gracious in everything he does.","[R1]: God gives a hand to those down on their luck, gives a fresh start to those ready to quit.","[R3]: All eyes are on you, expectant;  you give them their meals on time.  Generous to a fault, you lavish your favor on all creatures.","[R2]: Everything God does is right— the trademark on all his works is love.  God’s there, listening for all who pray, for all who pray and mean it.","[R1]: He does what’s best for those who fear him— hears them call out, and saves them.","[R3]: God sticks by all who love him, but it’s all over for those who don’t.  My mouth is filled with God’s praise.","[R2]: Let everything living bless him, bless his holy name from now to eternity! — PSA 145"]},"lesson3":{"title":"Gospel","lines":["[R2]: Then he drove it home by saying, “This isn’t pie in the sky by and by.  Some of you who are standing here are going to see it happen, see the kingdom of God arrive in full force.”","[R1]: Six days later, three of them did see it.  Jesus took Peter, James, and John and led them up a high mountain.","[R3]: His appearance changed from the inside out, right before their eyes.  His clothes shimmered, glistening white, whiter than any bleach could make them.","[R2]: Elijah, along with Moses, came into view, in deep conversation with Jesus.  Peter interrupted, “Rabbi, this is a great moment!","[R1]: Let’s build three memorials—one for you, one for Moses, one for Elijah.”  He blurted this out without thinking, stunned as they all were by what they were seeing.","[R3]: Just then a light-radiant cloud enveloped them, and from deep in the cloud, a voice: “This is my Son, marked by my love.","[R2]: Listen to him.”  The next minute the disciples were looking around, rubbing their eyes, seeing nothing but Jesus, only Jesus.","[R1]: Coming down the mountain, Jesus swore them to secrecy.  “Don’t tell a soul what you saw.","[R3]: After the Son of Man rises from the dead, you’re free to talk.”  They puzzled over that, wondering what on earth “rising from the dead” meant.","[R2]: Meanwhile they were asking, “Why do the religion scholars say that Elijah has to come first?”","[R1]: Jesus replied, “Elijah does come first and get everything ready for the coming of the Son of Man.","[R3]: They treated this Elijah like dirt, much like they will treat the Son of Man, who will, according to Scripture, suffer terribly and be kicked around contemptibly.”","[R2]: When they came back down the mountain to the other disciples, they saw a huge crowd around them, and the religion scholars cross-examining them.","[R1]: As soon as the people in the crowd saw Jesus, admiring excitement stirred them.","[R3]: They ran and greeted him.  He asked, “What’s going on?  What’s all the commotion?”","[R2]: A man out of the crowd answered, “Teacher, I brought my mute son, made speechless by a demon, to you.","[R1]: Whenever it seizes him, it throws him to the ground.  He foams at the mouth, grinds his teeth, and goes stiff as a board.","[R3]: I told your disciples, hoping they could deliver him, but they couldn’t.”  Jesus said, “What a generation!","[R2]: No sense of God!  How many times do I have to go over these things?  How much longer do I have to put up with this?","[R1]: Bring the boy here.”  They brought him.  When the demon saw Jesus, it threw the boy into a seizure, causing him to writhe on the ground and foam at the mouth.","[R3]: He asked the boy’s father, “How long has this been going on?”  “Ever since he was a little boy.","[R2]: Many times it pitches him into fire or the river to do away with him.  If you can do anything, do it.","[R1]: Have a heart and help us!”  Jesus said, “If?  There are no ‘ifs’ among believers.","[R3]: Anything can happen.”  No sooner were the words out of his mouth than the father cried, “Then I believe.","[R2]: Help me with my doubts!”  Seeing that the crowd was forming fast, Jesus gave the vile spirit its marching orders: “Dumb and deaf spirit, I command you—Out of him, and stay out!”","[R1]: Screaming, and with much thrashing about, it left.  The boy was pale as a corpse, so people started saying, “He’s dead.”","[R3]: But Jesus, taking his hand, raised him.  The boy stood up.  After arriving back home, his disciples cornered Jesus and asked, “Why couldn’t we throw the demon out?”","[R2]: He answered, “There is no way to get rid of this kind of demon except by prayer.” — MRK 9"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: We live in gratitude that our King came down from heaven for our salvation.","[S2]: The Holy Spirit empowered his incarnation by the Virgin Mary to become a man.","[S3]: For us he was crucified under Pontius Pilate, he suffered death and was buried..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
