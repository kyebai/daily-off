<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,2,1]},"psalm":{"title":"Psalm","lines":["[R1]: God!  Barbarians have broken into your home, violated your holy temple, left Jerusalem a pile of rubble!","[R3]: They’ve served up the corpses of your servants as carrion food for birds of prey, Threw the bones of your holy people out to the wild animals to gnaw on.","[R2]: They dumped out their blood like buckets of water.  All around Jerusalem, their bodies were left to rot, unburied.","[R1]: We’re nothing but a joke to our neighbors, graffiti scrawled on the city walls.","[R3]: How long do we have to put up with this, God?  Do you have it in for us for good?","[R2]: Will your smoldering rage never cool down?  If you’re going to be angry, be angry with the pagans who care nothing about you, or your rival kingdoms who ignore you.","[R1]: They’re the ones who ruined Jacob, who wrecked and looted the place where he lived.","[R3]: Don’t blame us for the sins of our parents.  Hurry up and help us;  we’re at the end of our rope.","[R2]: You’re famous for helping;  God, give us a break.  Your reputation is on the line.","[R1]: Pull us out of this mess, forgive us our sins— do what you’re famous for doing!","[R3]: Don’t let the heathen get by with their sneers: “Where’s your God?  Is he out to lunch?”","[R2]: Go public and show the godless world that they can’t kill your servants and get by with it.","[R1]: Give groaning prisoners a hearing;  pardon those on death row from their doom—you can do it!","[R3]: Give our jeering neighbors what they’ve got coming to them;  let their God-taunts boomerang and knock them flat.","[R2]: Then we, your people, the ones you love and care for, will thank you over and over and over.","[R1]: We’ll tell everyone we meet how wonderful you are, how praiseworthy you are!  Listen, Shepherd, Israel’s Shepherd— get all your Joseph sheep together.","[R3]: Throw beams of light from your dazzling throne So Ephraim, Benjamin, and Manasseh can see where they’re going.","[R2]: Get out of bed—you’ve slept long enough!  Come on the run before it’s too late.","[R1]: God, come back!  Smile your blessing smile: That will be our salvation.  God, God-of-the-Angel-Armies, how long will you smolder like a sleeping volcano while your people call for fire and brimstone?","[R3]: You put us on a diet of tears, bucket after bucket of salty tears to drink.  You make us look ridiculous to our friends;","[R2]: our enemies poke fun day after day.  God-of-the-Angel-Armies, come back!  Smile your blessing smile: That will be our salvation.","[R1]: Remember how you brought a young vine from Egypt, cleared out the brambles and briers and planted your very own vineyard?","[R3]: You prepared the good earth, you planted her roots deep;  the vineyard filled the land.","[R2]: Your vine soared high and shaded the mountains, even dwarfing the giant cedars.","[R1]: Your vine ranged west to the Sea, east to the River.  So why do you no longer protect your vine?","[R3]: Trespassers pick its grapes at will;  Wild pigs crash through and crush it, and the mice nibble away at what’s left.","[R2]: God-of-the-Angel-Armies, turn our way!  Take a good look at what’s happened and attend to this vine.","[R1]: Care for what you once tenderly planted— the vine you raised from a shoot.  And those who dared to set it on fire— give them a look that will kill!","[R3]: Then take the hand of your once-favorite child, the child you raised to adulthood.","[R2]: We will never turn our back on you;  breathe life into our lungs so we can shout your name!","[R1]: God, God-of-the-Angel-Armies, come back!  Smile your blessing smile: That will be our salvation.","[R3]: A song to our strong God!  a shout to the God of Jacob!  Anthems from the choir, music from the band, sweet sounds from lute and harp, Trumpets and trombones and horns: it’s festival day, a feast to God!","[R2]: A day decreed by God, solemnly ordered by the God of Jacob.  He commanded Joseph to keep this day so we’d never forget what he did in Egypt.","[R1]: I hear this most gentle whisper from One I never guessed would speak to me: “I took the world off your shoulders, freed you from a life of hard labor.","[R3]: You called to me in your pain;  I got you out of a bad place.  I answered you from where the thunder hides, I proved you at Meribah Fountain.","[R2]: “Listen, dear ones—get this straight;  O Israel, don’t take this lightly.  Don’t take up with strange gods, don’t worship the popular gods.","[R1]: I’m God, your God, the very God who rescued you from doom in Egypt, Then fed you all you could eat, filled your hungry stomachs.","[R3]: “But my people didn’t listen, Israel paid no attention;  So I let go of the reins and told them, ‘Run!","[R2]: Do it your own way!’  “Oh, dear people, will you listen to me now?  Israel, will you follow my map?","[R1]: I’ll make short work of your enemies, give your foes the back of my hand.  I’ll send the God-haters cringing like dogs, never to be heard from again.","[R3]: You’ll feast on my fresh-baked bread spread with butter and rock-pure honey.”  God calls the judges into his courtroom, he puts all the judges in the dock.","[R2]: “Enough!  You’ve corrupted justice long enough, you’ve let the wicked get away with murder.","[R1]: You’re here to defend the defenseless, to make sure that underdogs get a fair break;","[R3]: Your job is to stand up for the powerless, and prosecute all those who exploit them.”","[R2]: Ignorant judges!  Head-in-the-sand judges!  They haven’t a clue to what’s going on.","[R1]: And now everything’s falling apart, the world’s coming unglued.  “I appointed you judges, each one of you, deputies of the High God, But you’ve betrayed your commission and now you’re stripped of your rank, busted.”","[R3]: O God, give them what they’ve got coming!  You’ve got the whole world in your hands! — PSA 79"]},"lesson3":{"title":"Gospel","lines":["[R1]: When they neared Jerusalem, having arrived at Bethphage on Mount Olives, Jesus sent two disciples with these instructions: “Go over to the village across from you.","[R3]: You’ll find a donkey tethered there, her colt with her.  Untie her and bring them to me.","[R2]: If anyone asks what you’re doing, say, ‘The Master needs them!’  He will send them with you.”","[R1]: This is the full story of what was sketched earlier by the prophet: Tell Zion’s daughter, “Look, your king’s on his way, poised and ready, mounted On a donkey, on a colt, foal of a pack animal.”","[R3]: The disciples went and did exactly what Jesus told them to do.  They led the donkey and colt out, laid some of their clothes on them, and Jesus mounted.","[R2]: Nearly all the people in the crowd threw their garments down on the road, giving him a royal welcome.","[R1]: Others cut branches from the trees and threw them down as a welcome mat.  Crowds went ahead and crowds followed, all of them calling out, “Hosanna to David’s son!”","[R3]: “Blessed is he who comes in God’s name!”  “Hosanna in highest heaven!”  As he made his entrance into Jerusalem, the whole city was shaken.","[R2]: Unnerved, people were asking, “What’s going on here?  Who is this?”  The parade crowd answered, “This is the prophet Jesus, the one from Nazareth in Galilee.”","[R1]: Jesus went straight to the Temple and threw out everyone who had set up shop, buying and selling.","[R3]: He kicked over the tables of loan sharks and the stalls of dove merchants.  He quoted this text: My house was designated a house of prayer;","[R2]: You have made it a hangout for thieves.  Now there was room for the blind and crippled to get in.","[R1]: They came to Jesus and he healed them.  When the religious leaders saw the outrageous things he was doing, and heard all the children running and shouting through the Temple, “Hosanna to David’s Son!”","[R3]: they were up in arms and took him to task.  “Do you hear what these children are saying?”","[R2]: Jesus said, “Yes, I hear them.  And haven’t you read in God’s Word, ‘From the mouths of children and babies I’ll furnish a place of praise’?”","[R1]: Fed up, Jesus spun around and left the city for Bethany, where he spent the night.","[R3]: Early the next morning Jesus was returning to the city.  He was hungry.  Seeing a lone fig tree alongside the road, he approached it anticipating a breakfast of figs.","[R2]: When he got to the tree, there was nothing but fig leaves.  He said, “No more figs from this tree—ever!”","[R1]: The fig tree withered on the spot, a dry stick.  The disciples saw it happen.  They rubbed their eyes, saying, “Did we really see this?","[R3]: A leafy tree one minute, a dry stick the next?”  But Jesus was matter-of-fact: “Yes—and if you embrace this kingdom life and don’t doubt God, you’ll not only do minor feats like I did to the fig tree, but also triumph over huge obstacles.","[R2]: This mountain, for instance, you’ll tell, ‘Go jump in the lake,’ and it will jump.","[R1]: Absolutely everything, ranging from small to large, as you make it a part of your believing prayer, gets included as you lay hold of God.” — MAT 21"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for King Jesus, who was born of the Father before all ages.","[S2]: He is God from God, Light from Light, true God from true God. Begotten, not made.","[S3]: He is consubstantial with the Father; through him all things were made..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
