<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: God, listen!  Listen to my prayer, listen to the pain in my cries.  Don’t turn your back on me just when I need you so desperately.","[R2]: Pay attention!  This is a cry for help!  And hurry—this can’t wait!  I’m wasting away to nothing, I’m burning up with fever.","[R3]: I’m a ghost of my former self, half-consumed already by terminal illness.  My jaws ache from gritting my teeth;","[R1]: I’m nothing but skin and bones.  I’m like a buzzard in the desert, a crow perched on the rubble.","[R2]: Insomniac, I twitter away, mournful as a sparrow in the gutter.  All day long my enemies taunt me, while others just curse.","[R3]: They bring in meals—casseroles of ashes!  I draw drink from a barrel of my tears.","[R1]: And all because of your furious anger;  you swept me up and threw me out.  There’s nothing left of me— a withered weed, swept clean from the path.","[R2]: Yet you, God, are sovereign still, always and ever sovereign.  You’ll get up from your throne and help Zion— it’s time for compassionate help.","[R3]: Oh, how your servants love this city’s rubble and weep with compassion over its dust!","[R1]: The godless nations will sit up and take notice —see your glory, worship your name— When God rebuilds Zion, when he shows up in all his glory, When he attends to the prayer of the wretched.","[R2]: He won’t dismiss their prayer.  Write this down for the next generation so people not yet born will praise God: “God looked out from his high holy place;","[R3]: from heaven he surveyed the earth.  He listened to the groans of the doomed, he opened the doors of their death cells.”","[R1]: Write it so the story can be told in Zion, so God’s praise will be sung in Jerusalem’s streets And wherever people gather together along with their rulers to worship him.","[R2]: God sovereignly brought me to my knees, he cut me down in my prime.  “Oh, don’t,” I prayed, “please don’t let me die.","[R3]: You have more years than you know what to do with!  You laid earth’s foundations a long time ago, and handcrafted the very heavens;","[R1]: You’ll still be around when they’re long gone, threadbare and discarded like an old suit of clothes.","[R2]: You’ll throw them away like a worn-out coat, but year after year you’re as good as new.","[R3]: Your servants’ children will have a good place to live and their children will be at home with you.” — PSA 102"]},"lesson3":{"title":"Gospel","lines":["[R1]: Then Jesus told them, “Before the night’s over, you’re going to fall to pieces because of what happens to me.","[R2]: There is a Scripture that says, I’ll strike the shepherd;  dazed and confused, the sheep will be scattered.","[R3]: But after I am raised up, I, your Shepherd, will go ahead of you, leading the way to Galilee.”","[R1]: Peter broke in, “Even if everyone else falls to pieces on account of you, I won’t.”","[R2]: “Don’t be so sure,” Jesus said.  “This very night, before the rooster crows up the dawn, you will deny me three times.”","[R3]: Peter protested, “Even if I had to die with you, I would never deny you.”  All the others said the same thing.","[R1]: Then Jesus went with them to a garden called Gethsemane and told his disciples, “Stay here while I go over there and pray.”","[R2]: Taking along Peter and the two sons of Zebedee, he plunged into an agonizing sorrow.","[R3]: Then he said, “This sorrow is crushing my life out.  Stay here and keep vigil with me.”","[R1]: Going a little ahead, he fell on his face, praying, “My Father, if there is any way, get me out of this.","[R2]: But please, not what I want.  You, what do you want?”  When he came back to his disciples, he found them sound asleep.","[R3]: He said to Peter, “Can’t you stick it out with me a single hour?  Stay alert;  be in prayer so you don’t wander into temptation without even knowing you’re in danger.","[R1]: There is a part of you that is eager, ready for anything in God.  But there’s another part that’s as lazy as an old dog sleeping by the fire.”","[R2]: He then left them a second time.  Again he prayed, “My Father, if there is no other way than this, drinking this cup to the dregs, I’m ready.","[R3]: Do it your way.”  When he came back, he again found them sound asleep.  They simply couldn’t keep their eyes open.","[R1]: This time he let them sleep on, and went back a third time to pray, going over the same ground one last time.","[R2]: When he came back the next time, he said, “Are you going to sleep on and make a night of it?","[R3]: My time is up, the Son of Man is about to be handed over to the hands of sinners.","[R1]: Get up!  Let’s get going!  My betrayer is here.”  The words were barely out of his mouth when Judas (the one from the Twelve) showed up, and with him a gang from the high priests and religious leaders brandishing swords and clubs.","[R2]: The betrayer had worked out a sign with them: “The one I kiss, that’s the one—seize him.”","[R3]: He went straight to Jesus, greeted him, “How are you, Rabbi?”  and kissed him.","[R1]: Jesus said, “Friend, why this charade?”  Then they came on him—grabbed him and roughed him up.","[R2]: One of those with Jesus pulled his sword and, taking a swing at the Chief Priest’s servant, cut off his ear.","[R3]: Jesus said, “Put your sword back where it belongs.  All who use swords are destroyed by swords.","[R1]: Don’t you realize that I am able right now to call to my Father, and twelve companies—more, if I want them—of fighting angels would be here, battle-ready?","[R2]: But if I did that, how would the Scriptures come true that say this is the way it has to be?”","[R3]: Then Jesus addressed the mob: “What is this—coming out after me with swords and clubs as if I were a dangerous criminal?","[R1]: Day after day I have been sitting in the Temple teaching, and you never so much as lifted a hand against me.","[R2]: You’ve done it this way to confirm and fulfill the prophetic writings.”  Then all the disciples cut and ran. — MAT 26"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you Father for your Holy Spirit, the Lord, the giver of life.","[S2]: Who proceeds from you and the Son, with you both is adored and glorified.","[S3]: Who spoke through the prophets, shaping our story and mission in Holy Scripture..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
