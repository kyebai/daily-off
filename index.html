<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,1,0]},"psalm":{"title":"Psalm","lines":["[R3]: I’m feeling terrible—I couldn’t feel worse!  Get me on my feet again.  You promised, remember?","[R2]: When I told my story, you responded;  train me well in your deep wisdom.  Help me understand these things inside and out so I can ponder your miracle-wonders.","[R1]: My sad life’s dilapidated, a falling-down barn;  build me up again by your Word.","[R3]: Barricade the road that goes Nowhere;  grace me with your clear revelation.  I choose the true road to Somewhere, I post your road signs at every curve and corner.","[R2]: I grasp and cling to whatever you tell me;  God, don’t let me down!  I’ll run the course you lay out for me if you’ll just show me how.","[R1]: * * * God, teach me lessons for living so I can stay the course.  Give me insight so I can do what you tell me— my whole life one long, obedient response.","[R3]: Guide me down the road of your commandments;  I love traveling this freeway!  Give me an appetite for your words of wisdom, and not for piling up loot.","[R2]: Divert my eyes from toys and trinkets, invigorate me on the pilgrim way.  Affirm your promises to me— promises made to all who fear you.","[R1]: Deflect the harsh words of my critics— but what you say is always so good.  See how hungry I am for your counsel;","[R3]: preserve my life through your righteous ways!  * * * Let your love, God, shape my life with salvation, exactly as you promised;","[R2]: Then I’ll be able to stand up to mockery because I trusted your Word.  Don’t ever deprive me of truth, not ever— your commandments are what I depend on.","[R1]: Oh, I’ll guard with my life what you’ve revealed to me, guard it now, guard it ever;","[R3]: And I’ll stride freely through wide open spaces as I look for your truth and your wisdom;","[R2]: Then I’ll tell the world what I find, speak out boldly in public, unembarrassed.","[R1]: I cherish your commandments—oh, how I love them! — relishing every fragment of your counsel. — PSA 119"]},"lesson3":{"title":"Gospel","lines":["[R3]: After a few days, Jesus returned to Capernaum, and word got around that he was back home.","[R2]: A crowd gathered, jamming the entrance so no one could get in or out.  He was teaching the Word.","[R1]: They brought a paraplegic to him, carried by four men.  When they weren’t able to get in because of the crowd, they removed part of the roof and lowered the paraplegic on his stretcher.","[R3]: Impressed by their bold belief, Jesus said to the paraplegic, “Son, I forgive your sins.”","[R2]: Some religion scholars sitting there started whispering among themselves, “He can’t talk that way!","[R1]: That’s blasphemy!  God and only God can forgive sins.”  Jesus knew right away what they were thinking, and said, “Why are you so skeptical?","[R3]: Which is simpler: to say to the paraplegic, ‘I forgive your sins,’ or say, ‘Get up, take your stretcher, and start walking’?","[R2]: Well, just so it’s clear that I’m the Son of Man and authorized to do either, or both .","[R1]: .  .”  (he looked now at the paraplegic), “Get up.  Pick up your stretcher and go home.”","[R3]: And the man did it—got up, grabbed his stretcher, and walked out, with everyone there watching him.","[R2]: They rubbed their eyes, stunned—and then praised God, saying, “We’ve never seen anything like this!”","[R1]: Then Jesus went again to walk alongside the lake.  Again a crowd came to him, and he taught them.","[R3]: Strolling along, he saw Levi, son of Alphaeus, at his work collecting taxes.  Jesus said, “Come along with me.”","[R2]: He came.  Later Jesus and his disciples were at home having supper with a collection of disreputable guests.","[R1]: Unlikely as it seems, more than a few of them had become followers.  The religion scholars and Pharisees saw him keeping this kind of company and lit into his disciples: “What kind of example is this, acting cozy with the misfits?”","[R3]: Jesus, overhearing, shot back, “Who needs a doctor: the healthy or the sick?  I’m here inviting the sin-sick, not the spiritually-fit.”","[R2]: The disciples of John and the disciples of the Pharisees made a practice of fasting.","[R1]: Some people confronted Jesus: “Why do the followers of John and the Pharisees take on the discipline of fasting, but your followers don’t?”","[R3]: Jesus said, “When you’re celebrating a wedding, you don’t skimp on the cake and wine.","[R2]: You feast.  Later you may need to pull in your belt, but not now.  As long as the bride and groom are with you, you have a good time.","[R1]: No one throws cold water on a friendly bonfire.  This is Kingdom Come!”  He went on, “No one cuts up a fine silk scarf to patch old work clothes;","[R3]: you want fabrics that match.  And you don’t put your wine in cracked bottles.” — MRK 2"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for your one, holy, catholic and apostolic Church.","[S2]: Where we confess one Baptism for the forgiveness of sins,","[S3]: And look forward to the resurrection of the dead and the life of the age to come."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
