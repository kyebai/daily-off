<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,0,1]},"psalm":{"title":"Psalm","lines":["[R3]: I yell out to my God, I yell with all my might, I yell at the top of my lungs.  He listens.","[R1]: I found myself in trouble and went looking for my Lord;  my life was an open wound that wouldn’t heal.","[R2]: When friends said, “Everything will turn out all right,” I didn’t believe a word they said.","[R3]: I remember God—and shake my head.  I bow my head—then wring my hands.  I’m awake all night—not a wink of sleep;","[R1]: I can’t even say what’s bothering me.  I go over the days one by one, I ponder the years gone by.","[R2]: I strum my lute all through the night, wondering how to get my life together.  Will the Lord walk off and leave us for good?","[R3]: Will he never smile again?  Is his love worn threadbare?  Has his salvation promise burned out?","[R1]: Has God forgotten his manners?  Has he angrily stomped off and left us?  “Just my luck,” I said.","[R2]: “The High God retires just the moment I need him.”  Once again I’ll go over what God has done, lay out on the table the ancient wonders;","[R3]: I’ll ponder all the things you’ve accomplished, and give a long, loving look at your acts.","[R1]: O God!  Your way is holy!  No god is great like God!  You’re the God who makes things happen;","[R2]: you showed everyone what you can do— You pulled your people out of the worst kind of trouble, rescued the children of Jacob and Joseph.","[R3]: Ocean saw you in action, God, saw you and trembled with fear;  Deep Ocean was scared to death.","[R1]: Clouds belched buckets of rain, Sky exploded with thunder, your arrows flashing this way and that.","[R2]: From Whirlwind came your thundering voice, Lightning exposed the world, Earth reeled and rocked.","[R3]: You strode right through Ocean, walked straight through roaring Ocean, but nobody saw you come or go.","[R1]: Hidden in the hands of Moses and Aaron, You led your people like a flock of sheep. — PSA 77"]},"lesson3":{"title":"Gospel","lines":["[R3]: He continued according to plan, traveled to town after town, village after village, preaching God’s kingdom, spreading the Message.","[R1]: The Twelve were with him.  There were also some women in their company who had been healed of various evil afflictions and illnesses: Mary, the one called Magdalene, from whom seven demons had gone out;","[R2]: Joanna, wife of Chuza, Herod’s manager;  and Susanna—along with many others who used their considerable means to provide for the company.","[R3]: As they went from town to town, a lot of people joined in and traveled along.  He addressed them, using this story: “A farmer went out to sow his seed.","[R1]: Some of it fell on the road;  it was tramped down and the birds ate it.  Other seed fell in the gravel;","[R2]: it sprouted, but withered because it didn’t have good roots.  Other seed fell in the weeds;","[R3]: the weeds grew with it and strangled it.  Other seed fell in rich earth and produced a bumper crop.","[R1]: “Are you listening to this?  Really listening?”  His disciples asked, “Why did you tell this story?”","[R2]: He said, “You’ve been given insight into God’s kingdom—you know how it works.  There are others who need stories.","[R3]: But even with stories some of them aren’t going to get it: Their eyes are open but don’t see a thing, Their ears are open but don’t hear a thing.","[R1]: “This story is about some of those people.  The seed is the Word of God.  The seeds on the road are those who hear the Word, but no sooner do they hear it than the Devil snatches it from them so they won’t believe and be saved.","[R2]: “The seeds in the gravel are those who hear with enthusiasm, but the enthusiasm doesn’t go very deep.","[R3]: It’s only another fad, and the moment there’s trouble it’s gone.  “And the seed that fell in the weeds—well, these are the ones who hear, but then the seed is crowded out and nothing comes of it as they go about their lives worrying about tomorrow, making money, and having fun.","[R1]: “But the seed in the good earth—these are the good-hearts who seize the Word and hold on no matter what, sticking with it until there’s a harvest.","[R2]: “No one lights a lamp and then covers it with a washtub or shoves it under the bed.","[R3]: No, you set it up on a lamp stand so those who enter the room can see their way.","[R1]: We’re not keeping secrets;  we’re telling them.  We’re not hiding things;  we’re bringing everything out into the open.","[R2]: So be careful that you don’t become misers of what you hear.  Generosity begets generosity.","[R3]: Stinginess impoverishes.”  His mother and brothers showed up but couldn’t get through to him because of the crowd.","[R1]: He was given the message, “Your mother and brothers are standing outside wanting to see you.”","[R2]: He replied, “My mother and brothers are the ones who hear and do God’s Word.  Obedience is thicker than blood.” — LUK 8"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for your one, holy, catholic and apostolic Church.","[S2]: Where we confess one Baptism for the forgiveness of sins,","[S3]: And look forward to the resurrection of the dead and the life of the age to come."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
