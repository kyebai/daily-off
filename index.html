<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,0,2]},"psalm":{"title":"Psalm","lines":["[R2]: No doubt about it!  God is good— good to good people, good to the good-hearted.","[R1]: But I nearly missed it, missed seeing his goodness.  I was looking the other way, looking up to the people At the top, envying the wicked who have it made, Who have nothing to worry about, not a care in the whole wide world.","[R3]: Pretentious with arrogance, they wear the latest fashions in violence, Pampered and overfed, decked out in silk bows of silliness.","[R2]: They jeer, using words to kill;  they bully their way with words.  They’re full of hot air, loudmouths disturbing the peace.","[R1]: People actually listen to them—can you believe it?  Like thirsty puppies, they lap up their words.","[R3]: What’s going on here?  Is God out to lunch?  Nobody’s tending the store.  The wicked get by with everything;","[R2]: they have it made, piling up riches.  I’ve been stupid to play by the rules;  what has it gotten me?","[R1]: A long run of bad luck, that’s what— a slap in the face every time I walk out the door.","[R3]: If I’d have given in and talked like this, I would have betrayed your dear children.","[R2]: Still, when I tried to figure it out, all I got was a splitting headache .  .  .","[R1]: Until I entered the sanctuary of God.  Then I saw the whole picture: The slippery road you’ve put them on, with a final crash in a ditch of delusions.","[R3]: In the blink of an eye, disaster!  A blind curve in the dark, and—nightmare!  We wake up and rub our eyes.","[R2]: .  .  .  Nothing.  There’s nothing to them.  And there never was.  When I was beleaguered and bitter, totally consumed by envy, I was totally ignorant, a dumb ox in your very presence.","[R1]: I’m still in your presence, but you’ve taken my hand.  You wisely and tenderly lead me, and then you bless me.","[R3]: You’re all I want in heaven!  You’re all I want on earth!  When my skin sags and my bones get brittle, God is rock-firm and faithful.","[R2]: Look!  Those who left you are falling apart!  Deserters, they’ll never be heard from again.","[R1]: But I’m in the very presence of God— oh, how refreshing it is!  I’ve made Lord God my home.","[R3]: God, I’m telling the world what you do! — PSA 73"]},"lesson3":{"title":"Gospel","lines":["[R2]: Another day, a man stopped Jesus and asked, “Teacher, what good thing must I do to get eternal life?”","[R1]: Jesus said, “Why do you question me about what’s good?  God is the One who is good.","[R3]: If you want to enter the life of God, just do what he tells you.”  The man asked, “What in particular?”","[R2]: Jesus said, “Don’t murder, don’t commit adultery, don’t steal, don’t lie, honor your father and mother, and love your neighbor as you do yourself.”","[R1]: The young man said, “I’ve done all that.  What’s left?”  “If you want to give it all you’ve got,” Jesus replied, “go sell your possessions;","[R3]: give everything to the poor.  All your wealth will then be in heaven.  Then come follow me.”","[R2]: That was the last thing the young man expected to hear.  And so, crestfallen, he walked away.","[R1]: He was holding on tight to a lot of things, and he couldn’t bear to let go.  As he watched him go, Jesus told his disciples, “Do you have any idea how difficult it is for the rich to enter God’s kingdom?","[R3]: Let me tell you, it’s easier to gallop a camel through a needle’s eye than for the rich to enter God’s kingdom.”","[R2]: The disciples were staggered.  “Then who has any chance at all?”  Jesus looked hard at them and said, “No chance at all if you think you can pull it off yourself.","[R1]: Every chance in the world if you trust God to do it.”  Then Peter chimed in, “We left everything and followed you.","[R3]: What do we get out of it?”  Jesus replied, “Yes, you have followed me.  In the re-creation of the world, when the Son of Man will rule gloriously, you who have followed me will also rule, starting with the twelve tribes of Israel.","[R2]: And not only you, but anyone who sacrifices home, family, fields—whatever—because of me will get it all back a hundred times over, not to mention the considerable bonus of eternal life.","[R1]: This is the Great Reversal: many of the first ending up last, and the last first.”","[R3]: “God’s kingdom is like an estate manager who went out early in the morning to hire workers for his vineyard.","[R2]: They agreed on a wage of a dollar a day, and went to work.  “Later, about nine o’clock, the manager saw some other men hanging around the town square unemployed.","[R1]: He told them to go to work in his vineyard and he would pay them a fair wage.  They went.","[R3]: “He did the same thing at noon, and again at three o’clock.  At five o’clock he went back and found still others standing around.","[R2]: He said, ‘Why are you standing around all day doing nothing?’  “They said, ‘Because no one hired us.’","[R1]: “He told them to go to work in his vineyard.  “When the day’s work was over, the owner of the vineyard instructed his foreman, ‘Call the workers in and pay them their wages.","[R3]: Start with the last hired and go on to the first.’  “Those hired at five o’clock came up and were each given a dollar.","[R2]: When those who were hired first saw that, they assumed they would get far more.","[R1]: But they got the same, each of them one dollar.  Taking the dollar, they groused angrily to the manager, ‘These last workers put in only one easy hour, and you just made them equal to us, who slaved all day under a scorching sun.’","[R3]: “He replied to the one speaking for the rest, ‘Friend, I haven’t been unfair.  We agreed on the wage of a dollar, didn’t we?","[R2]: So take it and go.  I decided to give to the one who came last the same as you.","[R1]: Can’t I do what I want with my own money?  Are you going to get stingy because I am generous?’","[R3]: “Here it is again, the Great Reversal: many of the first ending up last, and the last first.” — MAT 19"]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
