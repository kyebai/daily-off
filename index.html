<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,1,0]},"psalm":{"title":"Psalm","lines":["[R3]: God, come close.  Come quickly!  Open your ears—it’s my voice you’re hearing!  Treat my prayer as sweet incense rising;","[R2]: my raised hands are my evening prayers.  Post a guard at my mouth, God, set a watch at the door of my lips.","[R1]: Don’t let me so much as dream of evil or thoughtlessly fall into bad company.  And these people who only do wrong— don’t let them lure me with their sweet talk!","[R3]: May the Just One set me straight, may the Kind One correct me, Don’t let sin anoint my head.","[R2]: I’m praying hard against their evil ways!  Oh, let their leaders be pushed off a high rock cliff;","[R1]: make them face the music.  Like a rock pulverized by a maul, let their bones be scattered at the gates of hell.","[R3]: But God, dear Lord, I only have eyes for you.  Since I’ve run for dear life to you, take good care of me.","[R2]: Protect me from their evil scheming, from all their demonic subterfuge.  Let the wicked fall flat on their faces, while I walk off without a scratch.","[R1]: I cry out loudly to God, loudly I plead with God for mercy.  I spill out all my complaints before him, and spell out my troubles in detail: “As I sink in despair, my spirit ebbing away, you know how I’m feeling, Know the danger I’m in, the traps hidden in my path.","[R3]: Look right, look left— there’s not a soul who cares what happens!  I’m up against the wall, with no exit— it’s just me, all alone.","[R2]: I cry out, God, call out: ‘You’re my last chance, my only hope for life!’  Oh listen, please listen;","[R1]: I’ve never been this low.  Rescue me from those who are hunting me down;  I’m no match for them.","[R3]: Get me out of this dungeon so I can thank you in public.  Your people will form a circle around me and you’ll bring me showers of blessing!” — PSA 141"]},"lesson3":{"title":"Gospel","lines":["[R3]: From there Jesus set out for the vicinity of Tyre.  He entered a house there where he didn’t think he would be found, but he couldn’t escape notice.","[R2]: He was barely inside when a woman who had a disturbed daughter heard where he was.","[R1]: She came and knelt at his feet, begging for help.  The woman was Greek, Syro-Phoenician by birth.","[R3]: She asked him to cure her daughter.  He said, “Stand in line and take your turn.","[R2]: The children get fed first.  If there’s any left over, the dogs get it.”  She said, “Of course, Master.","[R1]: But don’t dogs under the table get scraps dropped by the children?”  Jesus was impressed.","[R3]: “You’re right!  On your way!  Your daughter is no longer disturbed.  The demonic affliction is gone.”","[R2]: She went home and found her daughter relaxed on the bed, the torment gone for good.","[R1]: Then he left the region of Tyre, went through Sidon back to Galilee Lake and over to the district of the Ten Towns.","[R3]: Some people brought a man who could neither hear nor speak and asked Jesus to lay a healing hand on him.","[R2]: He took the man off by himself, put his fingers in the man’s ears and some spit on the man’s tongue.","[R1]: Then Jesus looked up in prayer, groaned mightily, and commanded, “Ephphatha! —Open up!”","[R3]: And it happened.  The man’s hearing was clear and his speech plain—just like that.","[R2]: Jesus urged them to keep it quiet, but they talked it up all the more, beside themselves with excitement.","[R1]: “He’s done it all and done it well.  He gives hearing to the deaf, speech to the speechless.”","[R3]: At about this same time he again found himself with a hungry crowd on his hands.","[R2]: He called his disciples together and said, “This crowd is breaking my heart.  They have stuck with me for three days, and now they have nothing to eat.","[R1]: If I send them home hungry, they’ll faint along the way—some of them have come a long distance.”","[R3]: His disciples responded, “What do you expect us to do about it?  Buy food out here in the desert?”","[R2]: He asked, “How much bread do you have?”  “Seven loaves,” they said.  So Jesus told the crowd to sit down on the ground.","[R1]: After giving thanks, he took the seven bread loaves, broke them into pieces, and gave them to his disciples so they could hand them out to the crowd.","[R3]: They also had a few fish.  He pronounced a blessing over the fish and told his disciples to hand them out as well.","[R2]: The crowd ate its fill.  Seven sacks of leftovers were collected.  There were well over four thousand at the meal.","[R1]: Then he sent them home.  He himself went straight to the boat with his disciples and set out for Dalmanoutha. — MRK 7"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for disclosing yourself as the one God.","[S2]: You are Father almighty, maker of heaven and earth, of all things visible and invisible,","[S3]: You begot one Lord, Jesus Christ, your only Son..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
