<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: All they did was sin even more, rebel in the desert against the High God.  They tried to get their own way with God, clamored for favors, for special attention.","[R2]: They whined like spoiled children, “Why can’t God give us a decent meal in this desert?","[R3]: Sure, he struck the rock and the water flowed, creeks cascaded from the rock.  But how about some fresh-baked bread?","[R1]: How about a nice cut of meat?”  When God heard that, he was furious— his anger flared against Jacob, he lost his temper with Israel.","[R2]: It was clear they didn’t believe God, had no intention of trusting in his help.","[R3]: But God helped them anyway, commanded the clouds and gave orders that opened the gates of heaven.","[R1]: He rained down showers of manna to eat, he gave them the Bread of Heaven.  They ate the bread of the mighty angels;","[R2]: he sent them all the food they could eat.  He let East Wind break loose from the skies, gave a strong push to South Wind.","[R3]: This time it was birds that rained down— succulent birds, an abundance of birds.","[R1]: He aimed them right for the center of their camp;  all round their tents there were birds.","[R2]: They ate and had their fill;  he handed them everything they craved on a platter.","[R3]: But their greed knew no bounds;  they stuffed their mouths with more and more.","[R1]: Finally, God was fed up, his anger erupted— he cut down their brightest and best, he laid low Israel’s finest young men.","[R2]: And—can you believe it? —they kept right on sinning;  all those wonders and they still wouldn’t believe!","[R3]: So their lives wasted away to nothing— nothing to show for their lives but a ghost town.","[R1]: When he cut them down, they came running for help;  they turned and pled for mercy.","[R2]: They gave witness that God was their rock, that High God was their redeemer, But they didn’t mean a word of it;","[R3]: they lied through their teeth the whole time.  They could not have cared less about him, wanted nothing to do with his Covenant.","[R1]: And God?  Compassionate!  Forgave the sin!  Didn’t destroy!  Over and over he reined in his anger, restrained his considerable wrath.","[R2]: He knew what they were made of;  he knew there wasn’t much to them, How often in the desert they had spurned him, tried his patience in those wilderness years.","[R3]: Time and again they pushed him to the limit, provoked Israel’s Holy God.  How quickly they forgot what he’d done, forgot their day of rescue from the enemy, When he did miracles in Egypt, wonders on the plain of Zoan.","[R1]: He turned the River and its streams to blood— not a drop of water fit to drink.","[R2]: He sent flies, which ate them alive, and frogs, which drove them crazy.  He turned their harvest over to caterpillars, everything they had worked for to the locusts.","[R3]: He flattened their grapevines with hail;  a killing frost ruined their orchards.","[R1]: He pounded their cattle with hail, let thunderbolts loose on their herds.  His anger flared, a wild firestorm of havoc, An advance guard of disease-carrying angels to clear the ground, preparing the way before him.","[R2]: He didn’t spare those people, he let the plague rage through their lives.  He killed all the Egyptian firstborns, lusty infants, offspring of Ham’s virility.","[R3]: Then he led his people out like sheep, took his flock safely through the wilderness.","[R1]: He took good care of them;  they had nothing to fear.  The Sea took care of their enemies for good.","[R2]: He brought them into his holy land, this mountain he claimed for his own.  He scattered everyone who got in their way;","[R3]: he staked out an inheritance for them— the tribes of Israel all had their own places. — PSA 78"]},"lesson3":{"title":"Gospel","lines":["[R1]: Then he was back in the Temple, teaching.  The high priests and leaders of the people came up and demanded, “Show us your credentials.","[R2]: Who authorized you to teach here?”  Jesus responded, “First let me ask you a question.","[R3]: You answer my question and I’ll answer yours.  About the baptism of John—who authorized it: heaven or humans?”","[R1]: They were on the spot and knew it.  They pulled back into a huddle and whispered, “If we say ‘heaven,’ he’ll ask us why we didn’t believe him;","[R2]: if we say ‘humans,’ we’re up against it with the people because they all hold John up as a prophet.”","[R3]: They decided to concede that round to Jesus.  “We don’t know,” they answered.  Jesus said, “Then neither will I answer your question.","[R1]: “Tell me what you think of this story: A man had two sons.  He went up to the first and said, ‘Son, go out for the day and work in the vineyard.’","[R2]: “The son answered, ‘I don’t want to.’  Later on he thought better of it and went.","[R3]: “The father gave the same command to the second son.  He answered, ‘Sure, glad to.’","[R1]: But he never went.  “Which of the two sons did what the father asked?”  They said, “The first.”","[R2]: Jesus said, “Yes, and I tell you that crooks and whores are going to precede you into God’s kingdom.","[R3]: John came to you showing you the right road.  You turned up your noses at him, but the crooks and whores believed him.","[R1]: Even when you saw their changed lives, you didn’t care enough to change and believe him.","[R2]: “Here’s another story.  Listen closely.  There was once a man, a wealthy farmer, who planted a vineyard.","[R3]: He fenced it, dug a winepress, put up a watchtower, then turned it over to the farmhands and went off on a trip.","[R1]: When it was time to harvest the grapes, he sent his servants back to collect his profits.","[R2]: “The farmhands grabbed the first servant and beat him up.  The next one they murdered.","[R3]: They threw stones at the third but he got away.  The owner tried again, sending more servants.","[R1]: They got the same treatment.  The owner was at the end of his rope.  He decided to send his son.","[R2]: ‘Surely,’ he thought, ‘they will respect my son.’  “But when the farmhands saw the son arrive, they rubbed their hands in greed.","[R3]: ‘This is the heir!  Let’s kill him and have it all for ourselves.’  They grabbed him, threw him out, and killed him.","[R1]: “Now, when the owner of the vineyard arrives home from his trip, what do you think he will do to the farmhands?”","[R2]: “He’ll kill them—a rotten bunch, and good riddance,” they answered.  “Then he’ll assign the vineyard to farmhands who will hand over the profits when it’s time.”","[R3]: Jesus said, “Right—and you can read it for yourselves in your Bibles: The stone the masons threw out is now the cornerstone.","[R1]: This is God’s work;  we rub our eyes, we can hardly believe it!  “This is the way it is with you.","[R2]: God’s kingdom will be taken back from you and handed over to a people who will live out a kingdom life.","[R3]: Whoever stumbles on this Stone gets shattered;  whoever the Stone falls on gets smashed.”","[R1]: When the religious leaders heard this story, they knew it was aimed at them.  They wanted to arrest Jesus and put him in jail, but, intimidated by public opinion, they held back.","[R2]: Most people held him to be a prophet of God. — MAT 21"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: We live in gratitude that our King came down from heaven for our salvation.","[S2]: The Holy Spirit empowered his incarnation by the Virgin Mary to become a man.","[S3]: For us he was crucified under Pontius Pilate, he suffered death and was buried..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
