<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,1,0]},"psalm":{"title":"Psalm","lines":["[R3]: Listen while I build my case, God, the most honest prayer you’ll ever hear.  Show the world I’m innocent— in your heart you know I am.","[R2]: Go ahead, examine me from inside out, surprise me in the middle of the night— You’ll find I’m just what I say I am.","[R1]: My words don’t run loose.  I’m not trying to get my way in the world’s way.  I’m trying to get your way, your Word’s way.","[R3]: I’m staying on your trail;  I’m putting one foot In front of the other.  I’m not giving up.","[R2]: I call to you, God, because I’m sure of an answer.  So—answer!  bend your ear!","[R1]: listen sharp!  Paint grace-graffiti on the fences;  take in your frightened children who Are running from the neighborhood bullies straight to you.","[R3]: Keep your eye on me;  hide me under your cool wing feathers From the wicked who are out to get me, from mortal enemies closing in.","[R2]: Their hearts are hard as nails, their mouths blast hot air.  They are after me, nipping my heels, determined to bring me down, Lions ready to rip me apart, young lions poised to pounce.","[R1]: Up, God: beard them!  break them!  By your sword, free me from their clutches;","[R3]: Barehanded, God, break these mortals, these flat-earth people who can’t think beyond today.","[R2]: I’d like to see their bellies swollen with famine food, The weeds they’ve sown harvested and baked into famine bread, With second helpings for their children and crusts for their babies to chew on.","[R1]: And me?  I plan on looking you full in the face.  When I get up, I’ll see your full stature and live heaven on earth. — PSA 17"]},"lesson3":{"title":"Gospel","lines":["[R3]: While he was teaching in the Temple, Jesus asked, “How is it that the religion scholars say that the Messiah is David’s ‘son,’ when we all know that David, inspired by the Holy Spirit, said, God said to my Master, “Sit here at my right hand until I put your enemies under your feet.”","[R2]: “David here designates the Messiah ‘my Master’—so how can the Messiah also be his ‘son’?”","[R1]: The large crowd was delighted with what they heard.  He continued teaching.  “Watch out for the religion scholars.","[R3]: They love to walk around in academic gowns, preening in the radiance of public flattery, basking in prominent positions, sitting at the head table at every church function.","[R2]: And all the time they are exploiting the weak and helpless.  The longer their prayers, the worse they get.","[R1]: But they’ll pay for it in the end.”  Sitting across from the offering box, he was observing how the crowd tossed money in for the collection.","[R3]: Many of the rich were making large contributions.  One poor widow came up and put in two small coins—a measly two cents.","[R2]: Jesus called his disciples over and said, “The truth is that this poor widow gave more to the collection than all the others put together.","[R1]: All the others gave what they’ll never miss;  she gave extravagantly what she couldn’t afford—she gave her all.”","[R3]: As he walked away from the Temple, one of his disciples said, “Teacher, look at that stonework!","[R2]: Those buildings!”  Jesus said, “You’re impressed by this grandiose architecture?","[R1]: There’s not a stone in the whole works that is not going to end up in a heap of rubble.”","[R3]: Later, as he was sitting on Mount Olives in full view of the Temple, Peter, James, John, and Andrew got him off by himself and asked, “Tell us, when is this going to happen?","[R2]: What sign will we get that things are coming to a head?”  Jesus began, “Watch out for doomsday deceivers.","[R1]: Many leaders are going to show up with forged identities claiming, ‘I’m the One.’","[R3]: They will deceive a lot of people.  When you hear of wars and rumored wars, keep your head and don’t panic.","[R2]: This is routine history, and no sign of the end.  Nation will fight nation and ruler fight ruler, over and over.","[R1]: Earthquakes will occur in various places.  There will be famines.  But these things are nothing compared to what’s coming.","[R3]: “And watch out!  They’re going to drag you into court.  And then it will go from bad to worse, dog-eat-dog, everyone at your throat because you carry my name.","[R2]: You’re placed there as sentinels to truth.  The Message has to be preached all across the world.","[R1]: “When they bring you, betrayed, into court, don’t worry about what you’ll say.","[R3]: When the time comes, say what’s on your heart—the Holy Spirit will make his witness in and through you.","[R2]: “It’s going to be brother killing brother, father killing child, children killing parents.","[R1]: There’s no telling who will hate you because of me.  “Stay with it—that’s what is required.","[R3]: Stay with it to the end.  You won’t be sorry;  you’ll be saved. — MRK 12"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you King Jesus for breaking the power of death, rising again on the third day in accordance with the Scriptures.","[S2]: Then you ascended into heaven, where you still sit at the right hand of the Father.","[S3]: But you will come again in glory to judge the living and the dead. Your kingdom will have no end..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
