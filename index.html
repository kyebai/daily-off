<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: O my soul, bless God!  God, my God, how great you are!  beautifully, gloriously robed, Dressed up in sunshine, and all heaven stretched out for your tent.","[R2]: You built your palace on the ocean deeps, made a chariot out of clouds and took off on wind-wings.","[R3]: You commandeered winds as messengers, appointed fire and flame as ambassadors.","[R1]: You set earth on a firm foundation so that nothing can shake it, ever.  You blanketed earth with ocean, covered the mountains with deep waters;","[R2]: Then you roared and the water ran away— your thunder crash put it to flight.  Mountains pushed up, valleys spread out in the places you assigned them.","[R3]: You set boundaries between earth and sea;  never again will earth be flooded.  You started the springs and rivers, sent them flowing among the hills.","[R1]: All the wild animals now drink their fill, wild donkeys quench their thirst.  Along the riverbanks the birds build nests, ravens make their voices heard.","[R2]: You water the mountains from your heavenly reservoirs;  earth is supplied with plenty of water.","[R3]: You make grass grow for the livestock, hay for the animals that plow the ground.","[R1]: Oh yes, God brings grain from the land, wine to make people happy, Their faces glowing with health, a people well-fed and hearty.","[R2]: God’s trees are well-watered— the Lebanon cedars he planted.  Birds build their nests in those trees;","[R3]: look—the stork at home in the treetop.  Mountain goats climb about the cliffs;","[R1]: badgers burrow among the rocks.  The moon keeps track of the seasons, the sun is in charge of each day.","[R2]: When it’s dark and night takes over, all the forest creatures come out.  The young lions roar for their prey, clamoring to God for their supper.","[R3]: When the sun comes up, they vanish, lazily stretched out in their dens.  Meanwhile, men and women go out to work, busy at their jobs until evening.","[R1]: What a wildly wonderful world, God!  You made it all, with Wisdom at your side, made earth overflow with your wonderful creations.","[R2]: Oh, look—the deep, wide sea, brimming with fish past counting, sardines and sharks and salmon.","[R3]: Ships plow those waters, and Leviathan, your pet dragon, romps in them.  All the creatures look expectantly to you to give them their meals on time.","[R1]: You come, and they gather around;  you open your hand and they eat from it.  If you turned your back, they’d die in a minute— Take back your Spirit and they die, revert to original mud;","[R2]: Send out your Spirit and they spring to life— the whole countryside in bloom and blossom.","[R3]: The glory of God—let it last forever!  Let God enjoy his creation!  He takes one look at earth and triggers an earthquake, points a finger at the mountains, and volcanoes erupt.","[R1]: Oh, let me sing to God all my life long, sing hymns to my God as long as I live!","[R2]: Oh, let my song please him;  I’m so pleased to be singing to God.  But clear the ground of sinners— no more godless men and women!","[R3]: O my soul, bless God! — PSA 104"]},"lesson3":{"title":"Gospel","lines":["[R1]: The gang that had seized Jesus led him before Caiaphas the Chief Priest, where the religion scholars and leaders had assembled.","[R2]: Peter followed at a safe distance until they got to the Chief Priest’s courtyard.","[R3]: Then he slipped in and mingled with the servants, watching to see how things would turn out.","[R1]: The high priests, conspiring with the Jewish Council, tried to cook up charges against Jesus in order to sentence him to death.","[R2]: But even though many stepped up, making up one false accusation after another, nothing was believable.","[R3]: Finally two men came forward with this: “He said, ‘I can tear down this Temple of God and after three days rebuild it.’”","[R1]: The Chief Priest stood up and said, “What do you have to say to the accusation?”","[R2]: Jesus kept silent.  Then the Chief Priest said, “I command you by the authority of the living God to say if you are the Messiah, the Son of God.”","[R3]: Jesus was curt: “You yourself said it.  And that’s not all.  Soon you’ll see it for yourself: The Son of Man seated at the right hand of the Mighty One, Arriving on the clouds of heaven.”","[R1]: At that, the Chief Priest lost his temper, ripping his robes, yelling, “He blasphemed!","[R2]: Why do we need witnesses to accuse him?  You all heard him blaspheme!  Are you going to stand for such blasphemy?”","[R3]: They all said, “Death!  That seals his death sentence.”  Then they were spitting in his face and knocking him around.","[R1]: They jeered as they slapped him: “Prophesy, Messiah: Who hit you that time?”  All this time, Peter was sitting out in the courtyard.","[R2]: One servant girl came up to him and said, “You were with Jesus the Galilean.”  In front of everybody there, he denied it.","[R3]: “I don’t know what you’re talking about.”  As he moved over toward the gate, someone else said to the people there, “This man was with Jesus the Nazarene.”","[R1]: Again he denied it, salting his denial with an oath: “I swear, I never laid eyes on the man.”","[R2]: Shortly after that, some bystanders approached Peter.  “You’ve got to be one of them.","[R3]: Your accent gives you away.”  Then he got really nervous and swore.  “I don’t know the man!”","[R1]: Just then a rooster crowed.  Peter remembered what Jesus had said: “Before the rooster crows, you will deny me three times.”","[R2]: He went out and cried and cried and cried. — MAT 26"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for your one, holy, catholic and apostolic Church.","[S2]: Where we confess one Baptism for the forgiveness of sins,","[S3]: And look forward to the resurrection of the dead and the life of the age to come."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
