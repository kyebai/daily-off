<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To you, Oh Lord, I lift up my soul."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: By your words I can see where I’m going;  they throw a beam of light on my dark path.","[R2]: I’ve committed myself and I’ll never turn back from living by your righteous order.","[R3]: Everything’s falling apart on me, God;  put me together again with your Word.  Adorn me with your finest sayings, God;","[R1]: teach me your holy rules.  My life is as close as my own hands, but I don’t forget what you have revealed.","[R2]: The wicked do their best to throw me off track, but I don’t swerve an inch from your course.","[R3]: I inherited your book on living;  it’s mine forever— what a gift!  And how happy it makes me!","[R1]: I concentrate on doing exactly what you say— I always have and always will.  * * * I hate the two-faced, but I love your clear-cut revelation.","[R2]: You’re my place of quiet retreat;  I wait for your Word to renew me.  Get out of my life, evildoers, so I can keep my God’s commands.","[R3]: Take my side as you promised;  I’ll live then for sure.  Don’t disappoint all my grand hopes.","[R1]: Stick with me and I’ll be all right;  I’ll give total allegiance to your definitions of life.","[R2]: Expose all who drift away from your sayings;  their casual idolatry is lethal.","[R3]: You reject earth’s wicked as so much rubbish;  therefore I lovingly embrace everything you say.","[R1]: I shiver in awe before you;  your decisions leave me speechless with reverence.","[R2]: * * * I stood up for justice and the right;  don’t leave me to the mercy of my oppressors.","[R3]: Take the side of your servant, good God;  don’t let the godless take advantage of me.","[R1]: I can’t keep my eyes open any longer, waiting for you to keep your promise to set everything right.","[R2]: Let your love dictate how you deal with me;  teach me from your textbook on life.","[R3]: I’m your servant—help me understand what that means, the inner meaning of your instructions.","[R1]: It’s time to act, God;  they’ve made a shambles of your revelation!  Yea-Saying God, I love what you command, I love it better than gold and gemstones;","[R2]: Yea-Saying God, I honor everything you tell me, I despise every deceitful detour. — PSA 119"]},"lesson3":{"title":"Gospel","lines":["[R1]: He climbed a mountain and invited those he wanted with him.  They climbed together.","[R2]: He settled on twelve, and designated them apostles.  The plan was that they would be with him, and he would send them out to proclaim the Word and give them authority to banish demons.","[R3]: These are the Twelve: Simon (Jesus later named him Peter, meaning “Rock”), James, son of Zebedee, John, brother of James (Jesus nicknamed the Zebedee brothers Boanerges, meaning “Sons of Thunder”), Andrew, Philip, Bartholomew, Matthew, Thomas, James, son of Alphaeus, Thaddaeus, Simon the Canaanite, Judas Iscariot (who betrayed him).","[R1]: Jesus came home and, as usual, a crowd gathered—so many making demands on him that there wasn’t even time to eat.","[R2]: His friends heard what was going on and went to rescue him, by force if necessary.","[R3]: They suspected he was believing his own press.  The religion scholars from Jerusalem came down spreading rumors that he was working black magic, using devil tricks to impress them with spiritual power.","[R1]: Jesus confronted their slander with a story: “Does it make sense to send a devil to catch a devil, to use Satan to get rid of Satan?","[R2]: A constantly squabbling family disintegrates.  If Satan were fighting Satan, there soon wouldn’t be any Satan left.","[R3]: Do you think it’s possible in broad daylight to enter the house of an awake, able-bodied man, and walk off with his possessions unless you tie him up first?","[R1]: Tie him up, though, and you can clean him out.  “Listen to this carefully.  I’m warning you.","[R2]: There’s nothing done or said that can’t be forgiven.  But if you persist in your slanders against God’s Holy Spirit, you are repudiating the very One who forgives, sawing off the branch on which you’re sitting, severing by your own perversity all connection with the One who forgives.”","[R3]: He gave this warning because they were accusing him of being in league with Evil.","[R1]: Just then his mother and brothers showed up.  Standing outside, they relayed a message that they wanted a word with him.","[R2]: He was surrounded by the crowd when he was given the message, “Your mother and brothers and sisters are outside looking for you.”","[R3]: Jesus responded, “Who do you think are my mother and brothers?”  Looking around, taking in everyone seated around him, he said, “Right here, right in front of you—my mother and my brothers.","[R1]: Obedience is thicker than blood.  The person who obeys God’s will is my brother and sister and mother.” — MRK 3"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for disclosing yourself as the one God.","[S2]: You are Father almighty, maker of heaven and earth, of all things visible and invisible,","[S3]: You begot one Lord, Jesus Christ, your only Son..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
