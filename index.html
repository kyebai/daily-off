<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,0,2]},"psalm":{"title":"Psalm","lines":["[R2]: Listen, Shepherd, Israel’s Shepherd— get all your Joseph sheep together.  Throw beams of light from your dazzling throne So Ephraim, Benjamin, and Manasseh can see where they’re going.","[R1]: Get out of bed—you’ve slept long enough!  Come on the run before it’s too late.","[R3]: God, come back!  Smile your blessing smile: That will be our salvation.  God, God-of-the-Angel-Armies, how long will you smolder like a sleeping volcano while your people call for fire and brimstone?","[R2]: You put us on a diet of tears, bucket after bucket of salty tears to drink.  You make us look ridiculous to our friends;","[R1]: our enemies poke fun day after day.  God-of-the-Angel-Armies, come back!  Smile your blessing smile: That will be our salvation.","[R3]: Remember how you brought a young vine from Egypt, cleared out the brambles and briers and planted your very own vineyard?","[R2]: You prepared the good earth, you planted her roots deep;  the vineyard filled the land.","[R1]: Your vine soared high and shaded the mountains, even dwarfing the giant cedars.","[R3]: Your vine ranged west to the Sea, east to the River.  So why do you no longer protect your vine?","[R2]: Trespassers pick its grapes at will;  Wild pigs crash through and crush it, and the mice nibble away at what’s left.","[R1]: God-of-the-Angel-Armies, turn our way!  Take a good look at what’s happened and attend to this vine.","[R3]: Care for what you once tenderly planted— the vine you raised from a shoot.  And those who dared to set it on fire— give them a look that will kill!","[R2]: Then take the hand of your once-favorite child, the child you raised to adulthood.","[R1]: We will never turn our back on you;  breathe life into our lungs so we can shout your name!","[R3]: God, God-of-the-Angel-Armies, come back!  Smile your blessing smile: That will be our salvation. — PSA 80"]},"lesson3":{"title":"Gospel","lines":["[R2]: Jesus responded by telling still more stories.  “God’s kingdom,” he said, “is like a king who threw a wedding banquet for his son.","[R1]: He sent out servants to call in all the invited guests.  And they wouldn’t come!","[R3]: “He sent out another round of servants, instructing them to tell the guests, ‘Look, everything is on the table, the prime rib is ready for carving.","[R2]: Come to the feast!’  “They only shrugged their shoulders and went off, one to weed his garden, another to work in his shop.","[R1]: The rest, with nothing better to do, beat up on the messengers and then killed them.","[R3]: The king was outraged and sent his soldiers to destroy those thugs and level their city.","[R2]: “Then he told his servants, ‘We have a wedding banquet all prepared but no guests.","[R1]: The ones I invited weren’t up to it.  Go out into the busiest intersections in town and invite anyone you find to the banquet.’","[R3]: The servants went out on the streets and rounded up everyone they laid eyes on, good and bad, regardless.","[R2]: And so the banquet was on—every place filled.  “When the king entered and looked over the scene, he spotted a man who wasn’t properly dressed.","[R1]: He said to him, ‘Friend, how dare you come in here looking like that!’  The man was speechless.","[R3]: Then the king told his servants, ‘Get him out of here—fast.  Tie him up and ship him to hell.","[R2]: And make sure he doesn’t get back in.’  “That’s what I mean when I say, ‘Many get invited;","[R1]: only a few make it.’”  That’s when the Pharisees plotted a way to trap him into saying something damaging.","[R3]: They sent their disciples, with a few of Herod’s followers mixed in, to ask, “Teacher, we know you have integrity, teach the way of God accurately, are indifferent to popular opinion, and don’t pander to your students.","[R2]: So tell us honestly: Is it right to pay taxes to Caesar or not?”  Jesus knew they were up to no good.","[R1]: He said, “Why are you playing these games with me?  Why are you trying to trap me?","[R3]: Do you have a coin?  Let me see it.”  They handed him a silver piece.  “This engraving—who does it look like?","[R2]: And whose name is on it?”  They said, “Caesar.”  “Then give Caesar what is his, and give God what is his.”","[R1]: The Pharisees were speechless.  They went off shaking their heads.  That same day, Sadducees approached him.","[R3]: This is the party that denies any possibility of resurrection.  They asked, “Teacher, Moses said that if a man dies childless, his brother is obligated to marry his widow and father a child with her.","[R2]: Here’s a case where there were seven brothers.  The first brother married and died, leaving no child, and his wife passed to his brother.","[R1]: The second brother also left her childless, then the third—and on and on, all seven.","[R3]: Eventually the wife died.  Now here’s our question: At the resurrection, whose wife is she?","[R2]: She was a wife to each of them.”  Jesus answered, “You’re off base on two counts: You don’t know what God said, and you don’t know how God works.","[R1]: At the resurrection we’re beyond marriage.  As with the angels, all our ecstasies and intimacies then will be with God.","[R3]: And regarding your speculation on whether the dead are raised or not, don’t you read your Bibles?","[R2]: The grammar is clear: God says, ‘I am—not was—the God of Abraham, the God of Isaac, the God of Jacob.’","[R1]: The living God defines himself not as the God of dead men, but of the living.”","[R3]: Hearing this exchange the crowd was much impressed. — MAT 22"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you King Jesus for breaking the power of death, rising again on the third day in accordance with the Scriptures.","[S2]: Then you ascended into heaven, where you still sit at the right hand of the Father.","[S3]: But you will come again in glory to judge the living and the dead. Your kingdom will have no end..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
