<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,0,1]},"psalm":{"title":"Psalm","lines":["[R3]: God!  Please hurry to my rescue!  God, come quickly to my side!  Those who are out to get me— let them fall all over themselves.","[R1]: Those who relish my downfall— send them down a blind alley.  Give them a taste of their own medicine, those gossips off clucking their tongues.","[R2]: Let those on the hunt for you sing and celebrate.  Let all who love your saving way say over and over, “God is mighty!”","[R3]: But I’ve lost it.  I’m wasted.  God—quickly, quickly!  Quick to my side, quick to my rescue!","[R1]: God, don’t lose a minute.  Give the gift of wise rule to the king, O God, the gift of just rule to the crown prince.","[R2]: May he judge your people rightly, be honorable to your meek and lowly.  Let the mountains give exuberant witness;","[R3]: shape the hills with the contours of right living.  Please stand up for the poor, help the children of the needy, come down hard on the cruel tyrants.","[R1]: Outlast the sun, outlive the moon— age after age after age.  Be rainfall on cut grass, earth-refreshing rain showers.","[R2]: Let righteousness burst into blossom and peace abound until the moon fades to nothing.","[R3]: Rule from sea to sea, from the River to the Rim.  Foes will fall on their knees before God, his enemies lick the dust.","[R1]: Kings remote and legendary will pay homage, kings rich and resplendent will turn over their wealth.","[R2]: All kings will fall down and worship, and godless nations sign up to serve him, Because he rescues the poor at the first sign of need, the destitute who have run out of luck.","[R3]: He opens a place in his heart for the down-and-out, he restores the wretched of the earth.","[R1]: He frees them from tyranny and torture— when they bleed, he bleeds;  when they die, he dies.","[R2]: And live!  Oh, let him live!  Deck him out in Sheba gold.  Offer prayers unceasing to him, bless him from morning to night.","[R3]: Fields of golden grain in the land, cresting the mountains in wild exuberance, Cornucopias of praise, praises springing from the city like grass from the earth.","[R1]: May he never be forgotten, his fame shine on like sunshine.  May all godless people enter his circle of blessing and bless the One who blessed them.","[R2]: Blessed God, Israel’s God, the one and only wonder-working God!  Blessed always his blazing glory!","[R3]: All earth brims with his glory.  Yes and Yes and Yes. — PSA 70; PSA 72"]},"lesson3":{"title":"Gospel","lines":["[R3]: Not long after that, Jesus went to the village Nain.  His disciples were with him, along with quite a large crowd.","[R1]: As they approached the village gate, they met a funeral procession—a woman’s only son was being carried out for burial.","[R2]: And the mother was a widow.  When Jesus saw her, his heart broke.  He said to her, “Don’t cry.”","[R3]: Then he went over and touched the coffin.  The pallbearers stopped.  He said, “Young man, I tell you: Get up.”","[R1]: The dead son sat up and began talking.  Jesus presented him to his mother.  They all realized they were in a place of holy mystery, that God was at work among them.","[R2]: They were quietly worshipful—and then noisily grateful, calling out among themselves, “God is back, looking to the needs of his people!”","[R3]: The news of Jesus spread all through the country.  John’s disciples reported back to him the news of all these events taking place.","[R1]: He sent two of them to the Master to ask the question, “Are you the One we’ve been expecting, or are we still waiting?”","[R2]: The men showed up before Jesus and said, “John the Baptizer sent us to ask you, ‘Are you the One we’ve been expecting, or are we still waiting?’”","[R3]: In the next two or three hours Jesus healed many from diseases, distress, and evil spirits.","[R1]: To many of the blind he gave the gift of sight.  Then he gave his answer: “Go back and tell John what you have just seen and heard: The blind see, The lame walk, Lepers are cleansed, The deaf hear, The dead are raised, The wretched of the earth have God’s salvation hospitality extended to them.","[R2]: “Is this what you were expecting?  Then count yourselves fortunate!”  After John’s messengers left to make their report, Jesus said more about John to the crowd of people.","[R3]: “What did you expect when you went out to see him in the wild?  A weekend camper?","[R1]: Hardly.  What then?  A sheik in silk pajamas?  Not in the wilderness, not by a long shot.","[R2]: What then?  A messenger from God?  That’s right, a messenger!  Probably the greatest messenger you’ll ever hear.","[R3]: He is the messenger Malachi announced when he wrote, I’m sending my messenger on ahead To make the road smooth for you.","[R1]: “Let me lay it out for you as plainly as I can: No one in history surpasses John the Baptizer, but in the kingdom he prepared you for, the lowliest person is ahead of him.","[R2]: The ordinary and disreputable people who heard John, by being baptized by him into the kingdom, are the clearest evidence;","[R3]: the Pharisees and religious officials would have nothing to do with such a baptism, wouldn’t think of giving up their place in line to their inferiors.","[R1]: “How can I account for the people of this generation?  They’re like spoiled children complaining to their parents, ‘We wanted to skip rope and you were always too tired;","[R2]: we wanted to talk but you were always too busy.’  John the Baptizer came fasting and you called him crazy.","[R3]: The Son of Man came feasting and you called him a boozer.  Opinion polls don’t count for much, do they?","[R1]: The proof of the pudding is in the eating.” — LUK 7"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you King Jesus for breaking the power of death, rising again on the third day in accordance with the Scriptures.","[S2]: Then you ascended into heaven, where you still sit at the right hand of the Father.","[S3]: But you will come again in glory to judge the living and the dead. Your kingdom will have no end..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
