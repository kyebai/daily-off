<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[2,0,1]},"psalm":{"title":"Psalm","lines":["[R3]: God!  Please hurry to my rescue!  God, come quickly to my side!  Those who are out to get me— let them fall all over themselves.","[R1]: Those who relish my downfall— send them down a blind alley.  Give them a taste of their own medicine, those gossips off clucking their tongues.","[R2]: Let those on the hunt for you sing and celebrate.  Let all who love your saving way say over and over, “God is mighty!”","[R3]: But I’ve lost it.  I’m wasted.  God—quickly, quickly!  Quick to my side, quick to my rescue!","[R1]: God, don’t lose a minute.  I run for dear life to God, I’ll never live to regret it.","[R2]: Do what you do so well: get me out of this mess and up on my feet.  Put your ear to the ground and listen, give me space for salvation.","[R3]: Be a guest room where I can retreat;  you said your door was always open!  You’re my salvation—my vast, granite fortress.","[R1]: My God, free me from the grip of Wicked, from the clutch of Bad and Bully.  You keep me going when times are tough— my bedrock, God, since my childhood.","[R2]: I’ve hung on you from the day of my birth, the day you took me from the cradle;","[R3]: I’ll never run out of praise.  Many gasp in alarm when they see me, but you take me in stride.","[R1]: Just as each day brims with your beauty, my mouth brims with praise.  But don’t turn me out to pasture when I’m old or put me on the shelf when I can’t pull my weight.","[R2]: My enemies are talking behind my back, watching for their chance to knife me.  The gossip is: “God has abandoned him.","[R3]: Pounce on him now;  no one will help him.”  God, don’t just watch from the sidelines.","[R1]: Come on!  Run to my side!  My accusers—make them lose face.  Those out to get me—make them look Like idiots, while I stretch out, reaching for you, and daily add praise to praise.","[R2]: I’ll write the book on your righteousness, talk up your salvation all the day long, never run out of good things to write or say.","[R3]: I come in the power of the Lord God, I post signs marking his right-of-way.  You got me when I was an unformed youth, God, and taught me everything I know.","[R1]: Now I’m telling the world your wonders;  I’ll keep at it until I’m old and gray.","[R2]: God, don’t walk off and leave me until I get out the news Of your strong right arm to this world, news of your power to the world yet to come, Your famous and righteous ways, O God.","[R3]: God, you’ve done it all!  Who is quite like you?  You, who made me stare trouble in the face, Turn me around;","[R1]: Now let me look life in the face.  I’ve been to the bottom;  Bring me up, streaming with honors;","[R2]: turn to me, be tender to me, And I’ll take up the lute and thank you to the tune of your faithfulness, God.","[R3]: I’ll make music for you on a harp, Holy One of Israel.  When I open up in song to you, I let out lungsful of praise, my rescued life a song.","[R1]: All day long I’m chanting about you and your righteous ways, While those who tried to do me in slink off looking ashamed.","[R2]: Give the gift of wise rule to the king, O God, the gift of just rule to the crown prince.","[R3]: May he judge your people rightly, be honorable to your meek and lowly.  Let the mountains give exuberant witness;","[R1]: shape the hills with the contours of right living.  Please stand up for the poor, help the children of the needy, come down hard on the cruel tyrants.","[R2]: Outlast the sun, outlive the moon— age after age after age.  Be rainfall on cut grass, earth-refreshing rain showers.","[R3]: Let righteousness burst into blossom and peace abound until the moon fades to nothing.","[R1]: Rule from sea to sea, from the River to the Rim.  Foes will fall on their knees before God, his enemies lick the dust.","[R2]: Kings remote and legendary will pay homage, kings rich and resplendent will turn over their wealth.","[R3]: All kings will fall down and worship, and godless nations sign up to serve him, Because he rescues the poor at the first sign of need, the destitute who have run out of luck.","[R1]: He opens a place in his heart for the down-and-out, he restores the wretched of the earth.","[R2]: He frees them from tyranny and torture— when they bleed, he bleeds;  when they die, he dies.","[R3]: And live!  Oh, let him live!  Deck him out in Sheba gold.  Offer prayers unceasing to him, bless him from morning to night.","[R1]: Fields of golden grain in the land, cresting the mountains in wild exuberance, Cornucopias of praise, praises springing from the city like grass from the earth.","[R2]: May he never be forgotten, his fame shine on like sunshine.  May all godless people enter his circle of blessing and bless the One who blessed them.","[R3]: Blessed God, Israel’s God, the one and only wonder-working God!  Blessed always his blazing glory!","[R1]: All earth brims with his glory.  Yes and Yes and Yes. — PSA 70"]},"lesson3":{"title":"Gospel","lines":["[R3]: When Jesus had completed these teachings, he left Galilee and crossed the region of Judea on the other side of the Jordan.","[R1]: Great crowds followed him there, and he healed them.  One day the Pharisees were badgering him: “Is it legal for a man to divorce his wife for any reason?”","[R2]: He answered, “Haven’t you read in your Bible that the Creator originally made man and woman for each other, male and female?","[R3]: And because of this, a man leaves father and mother and is firmly bonded to his wife, becoming one flesh—no longer two bodies but one.","[R1]: Because God created this organic union of the two sexes, no one should desecrate his art by cutting them apart.”","[R2]: They shot back in rebuttal, “If that’s so, why did Moses give instructions for divorce papers and divorce procedures?”","[R3]: Jesus said, “Moses provided for divorce as a concession to your hard heartedness, but it is not part of God’s original plan.","[R1]: I’m holding you to the original plan, and holding you liable for adultery if you divorce your faithful wife and then marry someone else.","[R2]: I make an exception in cases where the spouse has committed adultery.”  Jesus’ disciples objected, “If those are the terms of marriage, we haven’t got a chance.","[R3]: Why get married?”  But Jesus said, “Not everyone is mature enough to live a married life.","[R1]: It requires a certain aptitude and grace.  Marriage isn’t for everyone.  Some, from birth seemingly, never give marriage a thought.","[R2]: Others never get asked—or accepted.  And some decide not to get married for kingdom reasons.","[R3]: But if you’re capable of growing into the largeness of marriage, do it.”  One day children were brought to Jesus in the hope that he would lay hands on them and pray over them.","[R1]: The disciples shooed them off.  But Jesus intervened: “Let the children alone, don’t prevent them from coming to me.","[R2]: God’s kingdom is made up of people like these.”  After laying hands on them, he left. — MAT 19"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for your one, holy, catholic and apostolic Church.","[S2]: Where we confess one Baptism for the forgiveness of sins,","[S3]: And look forward to the resurrection of the dead and the life of the age to come."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
