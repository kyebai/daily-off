<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening (Psalm 24:10)", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: Let us pray for a holy and peaceful evening."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: Some of you set sail in big ships;  you put to sea to do business in faraway ports.","[R2]: Out at sea you saw God in action, saw his breathtaking ways with the ocean: With a word he called up the wind— an ocean storm, towering waves!","[R3]: You shot high in the sky, then the bottom dropped out;  your hearts were stuck in your throats.","[R1]: You were spun like a top, you reeled like a drunk, you didn’t know which end was up.","[R2]: Then you called out to God in your desperate condition;  he got you out in the nick of time.","[R3]: He quieted the wind down to a whisper, put a muzzle on all the big waves.  And you were so glad when the storm died down, and he led you safely back to harbor.","[R1]: So thank God for his marvelous love, for his miracle mercy to the children he loves.","[R2]: Lift high your praises when the people assemble, shout Hallelujah when the elders meet!","[R3]: God turned rivers into wasteland, springs of water into sunbaked mud;  Luscious orchards became alkali flats because of the evil of the people who lived there.","[R1]: Then he changed wasteland into fresh pools of water, arid earth into springs of water, Brought in the hungry and settled them there;","[R2]: they moved in—what a great place to live!  They sowed the fields, they planted vineyards, they reaped a bountiful harvest.","[R3]: He blessed them and they prospered greatly;  their herds of cattle never decreased.","[R1]: But abuse and evil and trouble declined as he heaped scorn on princes and sent them away.","[R2]: He gave the poor a safe place to live, treated their clans like well-cared-for sheep.","[R3]: Good people see this and are glad;  bad people are speechless, stopped in their tracks.","[R1]: If you are really wise, you’ll think this over— it’s time you appreciated God’s deep love. — PSA 107"]},"lesson3":{"title":"Gospel","lines":["[R1]: Late in the afternoon a wealthy man from Arimathea, a disciple of Jesus, arrived.","[R2]: His name was Joseph.  He went to Pilate and asked for Jesus’ body.  Pilate granted his request.","[R3]: Joseph took the body and wrapped it in clean linens, put it in his own tomb, a new tomb only recently cut into the rock, and rolled a large stone across the entrance.","[R1]: Then he went off.  But Mary Magdalene and the other Mary stayed, sitting in plain view of the tomb.","[R2]: After sundown, the high priests and Pharisees arranged a meeting with Pilate.  They said, “Sir, we just remembered that that liar announced while he was still alive, ‘After three days I will be raised.’","[R3]: We’ve got to get that tomb sealed until the third day.  There’s a good chance his disciples will come and steal the corpse and then go around saying, ‘He’s risen from the dead.’","[R1]: Then we’ll be worse off than before, the final deceit surpassing the first.”  Pilate told them, “You will have a guard.","[R2]: Go ahead and secure it the best you can.”  So they went out and secured the tomb, sealing the stone and posting guards.","[R3]: After the Sabbath, as the first light of the new week dawned, Mary Magdalene and the other Mary came to keep vigil at the tomb.","[R1]: Suddenly the earth reeled and rocked under their feet as God’s angel came down from heaven, came right up to where they were standing.","[R2]: He rolled back the stone and then sat on it.  Shafts of lightning blazed from him.","[R3]: His garments shimmered snow-white.  The guards at the tomb were scared to death.","[R1]: They were so frightened, they couldn’t move.  The angel spoke to the women: “There is nothing to fear here.","[R2]: I know you’re looking for Jesus, the One they nailed to the cross.  He is not here.","[R3]: He was raised, just as he said.  Come and look at the place where he was placed.","[R1]: “Now, get on your way quickly and tell his disciples, ‘He is risen from the dead.","[R2]: He is going on ahead of you to Galilee.  You will see him there.’  That’s the message.”","[R3]: The women, deep in wonder and full of joy, lost no time in leaving the tomb.  They ran to tell the disciples.","[R1]: Then Jesus met them, stopping them in their tracks.  “Good morning!”  he said.","[R2]: They fell to their knees, embraced his feet, and worshiped him.  Jesus said, “You’re holding on to me for dear life!","[R3]: Don’t be frightened like that.  Go tell my brothers that they are to go to Galilee, and that I’ll meet them there.”","[R1]: Meanwhile, the guards had scattered, but a few of them went into the city and told the high priests everything that had happened.","[R2]: They called a meeting of the religious leaders and came up with a plan: They took a large sum of money and gave it to the soldiers, bribing them to say, “His disciples came in the night and stole the body while we were sleeping.”","[R3]: They assured them, “If the governor hears about your sleeping on duty, we will make sure you don’t get blamed.”","[R1]: The soldiers took the bribe and did as they were told.  That story, cooked up in the Jewish High Council, is still going around.","[R2]: * * * Meanwhile, the eleven disciples were on their way to Galilee, headed for the mountain Jesus had set for their reunion.","[R3]: The moment they saw him they worshiped him.  Some, though, held back, not sure about worship, about risking themselves totally.","[R1]: Jesus, undeterred, went right ahead and gave his charge: “God authorized and commanded me to commission you: Go out and train everyone you meet, far and near, in this way of life, marking them by baptism in the threefold name: Father, Son, and Holy Spirit.","[R2]: Then instruct them in the practice of all I have commanded you.  I’ll be with you as you do this, day after day after day, right up to the end of the age.” — MAT 27"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for King Jesus, who was born of the Father before all ages.","[S2]: He is God from God, Light from Light, true God from true God. Begotten, not made.","[S3]: He is consubstantial with the Father; through him all things were made..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
