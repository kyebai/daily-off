<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: I’m determined to watch steps and tongue so they won’t land me in trouble.  I decided to hold my tongue as long as Wicked is in the room.","[R2]: “Mum’s the word,” I said, and kept quiet.  But the longer I kept silence The worse it got— my insides got hotter and hotter.","[R3]: My thoughts boiled over;  I spilled my guts.  “Tell me, what’s going on, God?  How long do I have to live?","[R1]: Give me the bad news!  You’ve kept me on pretty short rations;  my life is a string too short to be saved.","[R2]: Oh!  we’re all puffs of air.  Oh!  we’re all shadows in a campfire.  Oh!  we’re just spit in the wind.","[R3]: We make our pile, and then we leave it.  “What am I doing in the meantime, Lord?","[R1]: Hoping, that’s what I’m doing—hoping You’ll save me from a rebel life, save me from the contempt of idiots.","[R2]: I’ll say no more, I’ll shut my mouth, since you, Lord, are behind all this.  But I can’t take it much longer.","[R3]: When you put us through the fire to purge us from our sin, our dearest idols go up in smoke.","[R1]: Are we also nothing but smoke?  “Ah, God, listen to my prayer, my cry—open your ears.","[R2]: Don’t be callous;  just look at these tears of mine.  I’m a stranger here.  I don’t know my way— a migrant like my whole family.","[R3]: Give me a break, cut me some slack before it’s too late and I’m out of here.”  I waited and waited and waited for God.","[R1]: At last he looked;  finally he listened.  He lifted me out of the ditch, pulled me from deep mud.","[R2]: He stood me up on a solid rock to make sure I wouldn’t slip.  He taught me how to sing the latest God-song, a praise-song to our God.","[R3]: More and more people are seeing this: they enter the mystery, abandoning themselves to God.","[R1]: Blessed are you who give yourselves over to God, turn your backs on the world’s “sure thing,” ignore what the world worships;","[R2]: The world’s a huge stockpile of God-wonders and God-thoughts.  Nothing and no one compares to you!","[R3]: I start talking about you, telling what I know, and quickly run out of words.  Neither numbers nor words account for you.","[R1]: Doing something for you, bringing something to you— that’s not what you’re after.","[R2]: Being religious, acting pious— that’s not what you’re asking for.  You’ve opened my ears so I can listen.","[R3]: So I answered, “I’m coming.  I read in your letter what you wrote about me, And I’m coming to the party you’re throwing for me.”","[R1]: That’s when God’s Word entered my life, became part of my very being.  I’ve preached you to the whole congregation, I’ve kept back nothing, God—you know that.","[R2]: I didn’t keep the news of your ways a secret, didn’t keep it to myself.  I told it all, how dependable you are, how thorough.","[R3]: I didn’t hold back pieces of love and truth For myself alone.  I told it all, let the congregation know the whole story.","[R1]: Now God, don’t hold out on me, don’t hold back your passion.  Your love and truth are all that keeps me together.","[R2]: When troubles ganged up on me, a mob of sins past counting, I was so swamped by guilt I couldn’t see my way clear.","[R3]: More guilt in my heart than hair on my head, so heavy the guilt that my heart gave out.","[R1]: Soften up, God, and intervene;  hurry and get me some help, So those who are trying to kidnap my soul will be embarrassed and lose face, So anyone who gets a kick out of making me miserable will be heckled and disgraced, So those who pray for my ruin will be booed and jeered without mercy.","[R2]: But all who are hunting for you— oh, let them sing and be happy.  Let those who know what you’re all about tell the world you’re great and not quitting.","[R3]: And me?  I’m a mess.  I’m nothing and have nothing: make something of me.  You can do it;","[R1]: you’ve got what it takes— but God, don’t put it off.  Dignify those who are down on their luck;","[R2]: you’ll feel good—that’s what God does.  God looks after us all, makes us robust with life— Lucky to be in the land, we’re free from enemy worries.","[R3]: Whenever we’re sick and in bed, God becomes our nurse, nurses us back to health.","[R1]: I said, “God, be gracious!  Put me together again— my sins have torn me to pieces.”","[R2]: My enemies are wishing the worst for me;  they make bets on what day I will die.","[R3]: If someone comes to see me, he mouths empty platitudes, All the while gathering gossip about me to entertain the street-corner crowd.","[R1]: These “friends” who hate me whisper slanders all over town.  They form committees to plan misery for me.","[R2]: The rumor goes out, “He’s got some dirty, deadly disease.  The doctors have given up on him.”","[R3]: Even my best friend, the one I always told everything —he ate meals at my house all the time!","[R1]: — has bitten my hand.  God, give grace, get me up on my feet.  I’ll show them a thing or two.","[R2]: Meanwhile, I’m sure you’re on my side— no victory shouts yet from the enemy camp!","[R3]: You know me inside and out, you hold me together, you never fail to stand me tall in your presence so I can look you in the eye.","[R1]: Blessed is God, Israel’s God, always, always, always.  Yes.  Yes.  Yes. — PSA 39"]},"lesson3":{"title":"Gospel","lines":["[R1]: About that time Caesar Augustus ordered a census to be taken throughout the Empire.","[R2]: This was the first census when Quirinius was governor of Syria.  Everyone had to travel to his own ancestral hometown to be accounted for.","[R3]: So Joseph went from the Galilean town of Nazareth up to Bethlehem in Judah, David’s town, for the census.","[R1]: As a descendant of David, he had to go there.  He went with Mary, his fiancée, who was pregnant.","[R2]: While they were there, the time came for her to give birth.  She gave birth to a son, her firstborn.","[R3]: She wrapped him in a blanket and laid him in a manger, because there was no room in the hostel.","[R1]: There were shepherds camping in the neighborhood.  They had set night watches over their sheep.","[R2]: Suddenly, God’s angel stood among them and God’s glory blazed around them.  They were terrified.","[R3]: The angel said, “Don’t be afraid.  I’m here to announce a great and joyful event that is meant for everybody, worldwide: A Savior has just been born in David’s town, a Savior who is Messiah and Master.","[R1]: This is what you’re to look for: a baby wrapped in a blanket and lying in a manger.”","[R2]: At once the angel was joined by a huge angelic choir singing God’s praises: Glory to God in the heavenly heights, Peace to all men and women on earth who please him.","[R3]: As the angel choir withdrew into heaven, the shepherds talked it over.  “Let’s get over to Bethlehem as fast as we can and see for ourselves what God has revealed to us.”","[R1]: They left, running, and found Mary and Joseph, and the baby lying in the manger.","[R2]: Seeing was believing.  They told everyone they met what the angels had said about this child.","[R3]: All who heard the shepherds were impressed.  Mary kept all these things to herself, holding them dear, deep within herself.","[R1]: The shepherds returned and let loose, glorifying and praising God for everything they had heard and seen.","[R2]: It turned out exactly the way they’d been told!  When the eighth day arrived, the day of circumcision, the child was named Jesus, the name given by the angel before he was conceived. — LUK 2"]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
