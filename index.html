<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,2,1]},"psalm":{"title":"Psalm","lines":["[R1]: We’ve been hearing about this, God, all our lives.  Our fathers told us the stories their fathers told them, How single-handedly you weeded out the godless from the fields and planted us, How you sent those people packing but gave us a fresh start.","[R3]: We didn’t fight for this land;  we didn’t work for it—it was a gift!  You gave it, smiling as you gave it, delighting as you gave it.","[R2]: You’re my King, O God— command victories for Jacob!  With your help we’ll wipe out our enemies, in your name we’ll stomp them to dust.","[R1]: I don’t trust in weapons;  my sword won’t save me— But it’s you, you who saved us from the enemy;","[R3]: you made those who hate us lose face.  All day we parade God’s praise— we thank you by name over and over.","[R2]: But now you’ve walked off and left us, you’ve disgraced us and won’t fight for us.","[R1]: You made us turn tail and run;  those who hate us have cleaned us out.  You delivered us as sheep to the butcher, you scattered us to the four winds.","[R3]: You sold your people at a discount— you made nothing on the sale.  You made people on the street, people we know, poke fun and call us names.","[R2]: You made us a joke among the godless, a cheap joke among the rabble.  Every day I’m up against it, my nose rubbed in my shame— Gossip and ridicule fill the air, people out to get me crowd the street.","[R1]: All this came down on us, and we’ve done nothing to deserve it.  We never betrayed your Covenant: our hearts were never false, our feet never left your path.","[R3]: Do we deserve torture in a den of jackals?  or lockup in a black hole?  If we had forgotten to pray to our God or made fools of ourselves with store-bought gods, Wouldn’t God have figured this out?","[R2]: We can’t hide things from him.  No, you decided to make us martyrs, lambs assigned for sacrifice each day.","[R1]: Get up, God!  Are you going to sleep all day?  Wake up!  Don’t you care what happens to us?","[R3]: Why do you bury your face in the pillow?  Why pretend things are just fine with us?","[R2]: And here we are—flat on our faces in the dirt, held down with a boot on our necks.","[R1]: Get up and come to our rescue.  If you love us so much, Help us! — PSA 44"]},"lesson3":{"title":"Gospel","lines":["[R1]: Then when the days stipulated by Moses for purification were complete, they took him up to Jerusalem to offer him to God as commanded in God’s Law: “Every male who opens the womb shall be a holy offering to God,” and also to sacrifice the “pair of doves or two young pigeons” prescribed in God’s Law.","[R3]: In Jerusalem at the time, there was a man, Simeon by name, a good man, a man who lived in the prayerful expectancy of help for Israel.","[R2]: And the Holy Spirit was on him.  The Holy Spirit had shown him that he would see the Messiah of God before he died.","[R1]: Led by the Spirit, he entered the Temple.  As the parents of the child Jesus brought him in to carry out the rituals of the Law, Simeon took him into his arms and blessed God: God, you can now release your servant;","[R3]: release me in peace as you promised.  With my own eyes I’ve seen your salvation;","[R2]: it’s now out in the open for everyone to see: A God-revealing light to the non-Jewish nations, and of glory for your people Israel.","[R1]: Jesus’ father and mother were speechless with surprise at these words.  Simeon went on to bless them, and said to Mary his mother, This child marks both the failure and the recovery of many in Israel, A figure misunderstood and contradicted— the pain of a sword-thrust through you— But the rejection will force honesty, as God reveals who they really are.","[R3]: Anna the prophetess was also there, a daughter of Phanuel from the tribe of Asher.","[R2]: She was by now a very old woman.  She had been married seven years and a widow for eighty-four.","[R1]: She never left the Temple area, worshiping night and day with her fastings and prayers.","[R3]: At the very time Simeon was praying, she showed up, broke into an anthem of praise to God, and talked about the child to all who were waiting expectantly for the freeing of Jerusalem.","[R2]: When they finished everything required by God in the Law, they returned to Galilee and their own town, Nazareth.","[R1]: There the child grew strong in body and wise in spirit.  And the grace of God was on him.","[R3]: Every year Jesus’ parents traveled to Jerusalem for the Feast of Passover.  When he was twelve years old, they went up as they always did for the Feast.","[R2]: When it was over and they left for home, the child Jesus stayed behind in Jerusalem, but his parents didn’t know it.","[R1]: Thinking he was somewhere in the company of pilgrims, they journeyed for a whole day and then began looking for him among relatives and neighbors.","[R3]: When they didn’t find him, they went back to Jerusalem looking for him.  The next day they found him in the Temple seated among the teachers, listening to them and asking questions.","[R2]: The teachers were all quite taken with him, impressed with the sharpness of his answers.","[R1]: But his parents were not impressed;  they were upset and hurt.  His mother said, “Young man, why have you done this to us?","[R3]: Your father and I have been half out of our minds looking for you.”  He said, “Why were you looking for me?","[R2]: Didn’t you know that I had to be here, dealing with the things of my Father?”  But they had no idea what he was talking about.","[R1]: So he went back to Nazareth with them, and lived obediently with them.  His mother held these things dearly, deep within herself.","[R3]: And Jesus matured, growing up in both body and spirit, blessed by both God and people. — LUK 2"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for disclosing yourself as the one God.","[S2]: You are Father almighty, maker of heaven and earth, of all things visible and invisible,","[S3]: You begot one Lord, Jesus Christ, your only Son..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
