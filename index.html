<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[0,1,2]},"psalm":{"title":"Psalm","lines":["[R1]: Come, bless God, all you servants of God!  You priests of God, posted to the nightwatch in God’s shrine, Lift your praising hands to the Holy Place, and bless God.","[R2]: In turn, may God of Zion bless you— God who made heaven and earth!  Hallelujah!","[R3]: Praise the name of God, praise the works of God.  All you priests on duty in God’s temple, serving in the sacred halls of our God, Shout “Hallelujah!”","[R1]: because God’s so good, sing anthems to his beautiful name.  And why?  Because God chose Jacob, embraced Israel as a prize possession.","[R2]: I, too, give witness to the greatness of God, our Lord, high above all other gods.","[R3]: He does just as he pleases— however, wherever, whenever.  He makes the weather—clouds and thunder, lightning and rain, wind pouring out of the north.","[R1]: He struck down the Egyptian firstborn, both human and animal firstborn.  He made Egypt sit up and take notice, confronted Pharaoh and his servants with miracles.","[R2]: Yes, he struck down great nations, he slew mighty kings— Sihon king of the Amorites, also Og of Bashan— every last one of the Canaanite kings!","[R3]: Then he turned their land over to Israel, a gift of good land to his people.  God, your name is eternal, God, you’ll never be out-of-date.","[R1]: God stands up for his people, God holds the hands of his people.  The gods of the godless nations are mere trinkets, made for quick sale in the markets: Chiseled mouths that can’t talk, painted eyes that can’t see, Carved ears that can’t hear— dead wood!","[R2]: cold metal!  Those who make and trust them become like them.  Family of Israel, bless God!","[R3]: Family of Aaron, bless God!  Family of Levi, bless God!  You who fear God, bless God!","[R1]: Oh, blessed be God of Zion, First Citizen of Jerusalem!  Hallelujah! — PSA 134"]},"lesson3":{"title":"Gospel","lines":["[R1]: The apostles then rendezvoused with Jesus and reported on all that they had done and taught.","[R2]: Jesus said, “Come off by yourselves;  let’s take a break and get a little rest.”","[R3]: For there was constant coming and going.  They didn’t even have time to eat.  So they got in the boat and went off to a remote place by themselves.","[R1]: Someone saw them going and the word got around.  From the surrounding towns people went out on foot, running, and got there ahead of them.","[R2]: When Jesus arrived, he saw this huge crowd.  At the sight of them, his heart broke—like sheep with no shepherd they were.","[R3]: He went right to work teaching them.  When his disciples thought this had gone on long enough—it was now quite late in the day—they interrupted: “We are a long way out in the country, and it’s very late.","[R1]: Pronounce a benediction and send these folks off so they can get some supper.”","[R2]: Jesus said, “You do it.  Fix supper for them.”  They replied, “Are you serious?","[R3]: You want us to go spend a fortune on food for their supper?”  But he was quite serious.","[R1]: “How many loaves of bread do you have?  Take an inventory.”  That didn’t take long.","[R2]: “Five,” they said, “plus two fish.”  Jesus got them all to sit down in groups of fifty or a hundred—they looked like a patchwork quilt of wildflowers spread out on the green grass!","[R3]: He took the five loaves and two fish, lifted his face to heaven in prayer, blessed, broke, and gave the bread to the disciples, and the disciples in turn gave it to the people.","[R1]: He did the same with the fish.  They all ate their fill.  The disciples gathered twelve baskets of leftovers.","[R2]: More than five thousand were at the supper.  As soon as the meal was finished, Jesus insisted that the disciples get in the boat and go on ahead across to Bethsaida while he dismissed the congregation.","[R3]: After sending them off, he climbed a mountain to pray.  Late at night, the boat was far out at sea;","[R1]: Jesus was still by himself on land.  He could see his men struggling with the oars, the wind having come up against them.","[R2]: At about four o’clock in the morning, Jesus came toward them, walking on the sea.","[R3]: He intended to go right by them.  But when they saw him walking on the sea, they thought it was a ghost and screamed, scared to death.","[R1]: Jesus was quick to comfort them: “Courage!  It’s me.  Don’t be afraid.”  As soon as he climbed into the boat, the wind died down.","[R2]: They were stunned, shaking their heads, wondering what was going on.  They didn’t understand what he had done at the supper.","[R3]: None of this had yet penetrated their hearts.  They beached the boat at Gennesaret and tied up at the landing.","[R1]: As soon as they got out of the boat, word got around fast.  People ran this way and that, bringing their sick on stretchers to where they heard he was.","[R2]: Wherever he went, village or town or country crossroads, they brought their sick to the marketplace and begged him to let them touch the edge of his coat—that’s all.","[R3]: And whoever touched him became well. — MRK 6"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for your one, holy, catholic and apostolic Church.","[S2]: Where we confess one Baptism for the forgiveness of sins,","[S3]: And look forward to the resurrection of the dead and the life of the age to come."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
