<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a !important; color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>The Office</title>
    
    <!-- CRITICAL INLINE STYLES -->
    <style>
        html, body { 
            background-color: #0f172a !important; 
            color: #ffffff;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: system-ui, -apple-system, sans-serif; 
            color-scheme: dark; 
        }
        #deck { flex: 1; position: relative; overflow: hidden; }
        .slide { display: none; background: black; color: white; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 40px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .slide.active { display: block; }
        .content-box { background: white; color: black; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #bf9000; font-size: 1rem; }
        .speaker-name { color: #bf9000; font-weight: bold; }
        .gold-header { color: #bf9000; font-weight: bold; border-bottom: 2px solid #bf9000; font-size: 1.75rem; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .content-box { font-size: 1.25rem; }
            .gold-header { font-size: 2.5rem; }
        }
        .fixed-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 16px; background: #0f172a; border-top: 2px solid #bf9000; z-index: 100; }
        
        /* Instant Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #0f172a !important;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 18vh;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .gold-cross-icon {
            width: 80px;
            height: 110px;
            fill: #bf9000;
            margin-bottom: 24px;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body style="background-color: #0f172a !important;">
    <!-- Instant Loading Screen with Simple Gold Cross -->
    <div id="loader" style="background-color: #0f172a !important;">
        <svg class="gold-cross-icon" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,0 L 60,0 L 60,35 L 95,35 L 95,55 L 60,55 L 60,140 L 40,140 L 40,55 L 5,55 L 5,35 L 40,35 Z" />
        </svg>
        <div id="loader-text" style="font-size: 1.25rem; font-weight: bold; color: #bf9000; letter-spacing: 0.05em;">Loading...</div>
    </div>

    <div id="deck"></div>
    <div id="footer-nav" class="fixed-nav">
        <button id="pray-btn" onclick="propagateNamesAndStart()" style="display: none; background: #bf9000; color: white; padding: 15px 40px; border-radius: 5px; font-weight: bold;">Pray</button>
        
        <div id="nav-controls" style="display: none; gap: 16px;">
            <button onclick="changeSlide(-1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Previous</button>
            <button onclick="changeSlide(1)" style="background: #bf9000; color: white; padding: 10px 20px; border-radius: 5px;">Next</button>
        </div>
    </div>
    <script>
        const SLIDE_ORDER = ["opening", "confession", "psalm", "lessonintro", "lesson2", "lesson3", "intercessions", "creed", "maranatha"];
        let currentSlide = 0;
        let speakerNames = ["Saint 1", "Saint 2", "Saint 3"];
        const PERMANENT = {
            "opening": { title: "Opening", lines: ["[S1]: Who is the King of Glory?", "[S2]: The Lord of hosts, He is the King of Glory.", "[S3]: To Him we lift up our souls - our allegience to Him alone."] },
            "confession": { title: "Confession", lines: ["[S1]: Lord Jesus Christ, have mercy upon us,", "[S2]: forgive us our sins, and by the power of your Holy Spirit raise us up", "[S3]: To serve you in newness of life, to the glory of your Name."] },
            "lessonintro": { title: "Lessons", lines: ["[S1]: Give us ears to hear your Words.", "[S2]: Give us soft hearts to be shaped by them.", "[S3]: Give us hands and mouths to be their imager."] },
            "intercessions": { title: "Intercessions", lines: ["[S1]: We pray for our church, our homes, and all whom you've given us.", "*Pause for personal prayer*", "[S3]: Lord, in your mercy, hear our prayer."] },
            "maranatha": { title: "The Maranatha Sending", lines: ["[S1]: Surely He is coming soon. Amen. Come, Lord Jesus!", "[S2]: The Spirit and the Bride say, Come. And let the one who hears say, Come.", "[S3]: The grace of the Lord Jesus be with all the saints. Amen."] }
        };
        const DAILY_CONTENT = {"metadata":{"rotation":[1,0,2]},"psalm":{"title":"Psalm","lines":["[R2]: God!  God!  I am running to you for dear life;  the chase is wild.  If they catch me, I’m finished: ripped to shreds by foes fierce as lions, dragged into the forest and left unlooked for, unremembered.","[R1]: God, if I’ve done what they say— betrayed my friends, ripped off my enemies— If my hands are really that dirty, let them get me, walk all over me, leave me flat on my face in the dirt.","[R3]: Stand up, God;  pit your holy fury against my furious enemies.  Wake up, God.  My accusers have packed the courtroom;","[R2]: it’s judgment time.  Take your place on the bench, reach for your gavel, throw out the false charges against me.","[R1]: I’m ready, confident in your verdict: “Innocent.”  Close the book on Evil, God, but publish your mandate for us.","[R3]: You get us ready for life: you probe for our soft spots, you knock off our rough edges.","[R2]: And I’m feeling so fit, so safe: made right, kept right.  God in solemn honor does things right, but his nerves are sandpapered raw.","[R1]: Nobody gets by with anything.  God is already in action— Sword honed on his whetstone, bow strung, arrow on the string, Lethal weapons in hand, each arrow a flaming missile.","[R3]: Look at that guy!  He had sex with sin, he’s pregnant with evil.  Oh, look!  He’s having the baby—a Lie-Baby!","[R2]: See that man shoveling day after day, digging, then concealing, his man-trap down that lonely stretch of road?","[R1]: Go back and look again—you’ll see him in it headfirst, legs waving in the breeze.","[R3]: That’s what happens: mischief backfires;  violence boomerangs.  I’m thanking God, who makes things right.","[R2]: I’m singing the fame of heaven-high God. — PSA 7"]},"lesson3":{"title":"Gospel","lines":["[R2]: When they were nearing Jerusalem, at Bethphage and Bethany on Mount Olives, he sent off two of the disciples with instructions: “Go to the village across from you.","[R1]: As soon as you enter, you’ll find a colt tethered, one that has never yet been ridden.","[R3]: Untie it and bring it.  If anyone asks, ‘What are you doing?’  say, ‘The Master needs him, and will return him right away.’”","[R2]: They went and found a colt tied to a door at the street corner and untied it.  Some of those standing there said, “What are you doing untying that colt?”","[R1]: The disciples replied exactly as Jesus had instructed them, and the people let them alone.","[R3]: They brought the colt to Jesus, spread their coats on it, and he mounted.  The people gave him a wonderful welcome, some throwing their coats on the street, others spreading out rushes they had cut in the fields.","[R2]: Running ahead and following after, they were calling out, Hosanna!  Blessed is he who comes in God’s name!","[R1]: Blessed the coming kingdom of our father David!  Hosanna in highest heaven!  He entered Jerusalem, then entered the Temple.","[R3]: He looked around, taking it all in.  But by now it was late, so he went back to Bethany with the Twelve.","[R2]: As they left Bethany the next day, he was hungry.  Off in the distance he saw a fig tree in full leaf.","[R1]: He came up to it expecting to find something for breakfast, but found nothing but fig leaves.","[R3]: (It wasn’t yet the season for figs.)  He addressed the tree: “No one is going to eat fruit from you again—ever!”","[R2]: And his disciples overheard him.  They arrived at Jerusalem.  Immediately on entering the Temple Jesus started throwing out everyone who had set up shop there, buying and selling.","[R1]: He kicked over the tables of the bankers and the stalls of the pigeon merchants.","[R3]: He didn’t let anyone even carry a basket through the Temple.  And then he taught them, quoting this text: My house was designated a house of prayer for the nations;","[R2]: You’ve turned it into a hangout for thieves.  The high priests and religion scholars heard what was going on and plotted how they might get rid of him.","[R1]: They panicked, for the entire crowd was carried away by his teaching.  At evening, Jesus and his disciples left the city.","[R3]: In the morning, walking along the road, they saw the fig tree, shriveled to a dry stick.","[R2]: Peter, remembering what had happened the previous day, said to him, “Rabbi, look—the fig tree you cursed is shriveled up!”","[R1]: Jesus was matter-of-fact: “Embrace this God-life.  Really embrace it, and nothing will be too much for you.","[R3]: This mountain, for instance: Just say, ‘Go jump in the lake’—no shuffling or hemming and hawing—and it’s as good as done.","[R2]: That’s why I urge you to pray for absolutely everything, ranging from small to large.","[R1]: Include everything as you embrace this God-life, and you’ll get God’s everything.","[R3]: And when you assume the posture of prayer, remember that it’s not all asking.  If you have anything against someone, forgive—only then will your heavenly Father be inclined to also wipe your slate clean of sins.” — MRK 11"]},"creed":{"title":"Affirmation of Faith","lines":["[S1]: Thank you for disclosing yourself as the one God.","[S2]: You are Father almighty, maker of heaven and earth, of all things visible and invisible,","[S3]: You begot one Lord, Jesus Christ, your only Son..."]}};

        function formatLine(line, globalLineIndex) {
            const hasSpeakerTag = line.startsWith("[R") || line.startsWith("[S");
            if (!hasSpeakerTag) return line;
            
            const rot = DAILY_CONTENT.metadata.rotation;
            let speakerIndex;
            
            if (line.startsWith("[S")) {
                const sIndex = parseInt(line.charAt(2)) - 1;
                speakerIndex = rot[sIndex];
            } else {
                speakerIndex = rot[globalLineIndex % 3];
            }
            
            const name = speakerNames[speakerIndex];
            let cleanLine = line;
            const parts = line.split("]: ");
            if (parts.length > 1) {
                cleanLine = parts.slice(1).join("]: ");
            }
            return '<span class="speaker-name">' + name + '</span>: ' + cleanLine;
        }

        function propagateNamesAndStart() {
            speakerNames[0] = document.getElementById('s1').value;
            speakerNames[1] = document.getElementById('s2').value;
            speakerNames[2] = document.getElementById('s3').value;
            
            currentSlide = 1;
            renderDeck();
        }

        function changeSlide(direction) {
            const allSlides = document.querySelectorAll('.slide');
            currentSlide = Math.max(0, Math.min(allSlides.length - 1, currentSlide + direction));
            renderDeck();
        }

        function renderDeck() {
            const deck = document.getElementById('deck');
            const prayBtn = document.getElementById('pray-btn');
            const navControls = document.getElementById('nav-controls');
            deck.innerHTML = '';

            if (currentSlide === 0) {
                prayBtn.style.display = 'block';
                navControls.style.display = 'none';
            } else {
                prayBtn.style.display = 'none';
                navControls.style.display = 'flex';
            }

            const welcome = document.createElement('div');
            welcome.className = 'slide ' + (currentSlide === 0 ? 'active' : '');
            welcome.innerHTML = '<h1 class="gold-header">Welcome</h1>' +
                '<div style="display: flex; flex-direction: column; gap: 16px; max-width: 42rem;">' +
                    '<input type="text" id="s1" class="content-box" value="' + speakerNames[0] + '">' +
                    '<input type="text" id="s2" class="content-box" value="' + speakerNames[1] + '">' +
                    '<input type="text" id="s3" class="content-box" value="' + speakerNames[2] + '">' +
                '</div>';
            deck.appendChild(welcome);

            SLIDE_ORDER.forEach(key => {
                let globalLineCounter = 0;
                const data = PERMANENT[key] || DAILY_CONTENT[key];
                if (!data) return;
                
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item.lines || item.lines.length === 0) return;
                    
                    for (let i = 0; i < item.lines.length; i += 3) {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        
                        slide.innerHTML = '<h1 class="gold-header">' + item.title + '</h1>' +
                            item.lines.slice(i, i + 3).map((line) => {
                                const lineContent = '<div class="content-box">' + formatLine(line, globalLineCounter) + '</div>';
                                globalLineCounter++;
                                return lineContent;
                            }).join('');
                        deck.appendChild(slide);
                    }
                });
            });

            const allSlides = document.querySelectorAll('.slide');
            if (allSlides.length > 0) {
                currentSlide = Math.min(currentSlide, allSlides.length - 1);
                allSlides[currentSlide].classList.add('active');
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = Date.now();
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const todayFormatted = new Date().toLocaleDateString('en-US', options);
                const loaderText = document.getElementById('loader-text');
                if (loaderText) {
                    loaderText.innerText = 'Loading ' + todayFormatted + '...';
                }
                
                renderDeck();
            } catch(e) {
                console.error("Render failed: ", e);
            }

            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, 1500 - elapsedTime);
            setTimeout(dismissLoader, remainingTime);
        });
    </script>
</body>
</html>
